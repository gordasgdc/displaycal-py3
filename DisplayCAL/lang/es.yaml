"3dlut.1dlut.videolut.nonlinear": |-
  La calibración LUT 1D de las tablas gamma de la tarjeta de video del dispositivo de visualización no es lineal, pero la LUT 3D contiene la calibración LUT 1D aplicada. Asegúrese de restablecer manualmente las tablas gamma de la tarjeta de video a lineal antes de usar la LUT 3D, o cree una LUT 3D sin calibración aplicada (para hacerlo, active “Mostrar opciones avanzadas” en el menú “Opciones” y desactive “Aplicar calibración (vcgt)” así como “Crear LUT 3D después de perfilar” en la configuración de LUT 3D, y luego cree una nueva LUT 3D).
