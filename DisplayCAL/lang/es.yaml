"support.feedback.note": |-
  La aplicación no envía nada por sí misma y necesitas una cuenta de GitHub para enviarlo allí. El diagnóstico está redactado (carpeta personal, nombre de usuario, correo, dirección IP, números de serie, tokens), pero revisa la vista previa antes de incluirlo.
