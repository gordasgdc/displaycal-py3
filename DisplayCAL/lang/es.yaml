"warning.suspicious_delta_e": |-
  Advertencia: Se han encontrado mediciones sospechosas. Tenga en cuenta que esta comprobación asume un dispositivo de visualización similar a sRGB. Si su dispositivo de visualización difiere de esta suposición (p. ej., si tiene una gama muy amplia o una respuesta tonal muy alejada de sRGB), es probable que los errores detectados no sean significativos.

  Se cumplió uno o varios de los siguientes criterios:

  • Parches consecutivos con números RGB distintos, pero con ΔE*00 sospechosamente bajo entre sus mediciones.
  • Gris RGB con números RGB crecientes respecto al parche anterior, pero con luminosidad (L*) decreciente.
  • Gris RGB con números RGB decrecientes respecto al parche anterior, pero con luminosidad (L*) creciente.
  • ΔE*00 y ΔL*00 o ΔH*00 o ΔC*00 inusualmente altos de las mediciones respecto al equivalente sRGB de los números RGB.

  Esto puede indicar errores de medición. Los valores considerados problemáticos (¡lo cual no tiene por qué ser cierto!) se resaltan en rojo. Revise cuidadosamente las mediciones y marque las que desea aceptar. También puede editar los valores RGB y XYZ.
"warning.suspicious_delta_e.info": |-
  Explicación de las columnas Δ:

  ΔE*00 XYZ A/B: ΔE*00 de valores medidos respecto a los valores medidos del parche anterior. Si falta este valor, no fue un factor durante la comprobación. Si está presente, se asume que es demasiado bajo.

  0.5 ΔE*00 RGB A/B: ΔE*00 del equivalente sRGB de los números RGB respecto al equivalente sRGB de los números RGB del parche anterior (con un factor de 0.5). Si este valor está presente, representa el valor de comparación (mínimo) durante la comprobación de un ΔE*00 XYZ A/B presumiblemente demasiado bajo. Sirve como orientación muy aproximada.

  ΔE*00 RGB-XYZ: ΔE*00 de valores medidos respecto al equivalente sRGB de los números RGB.
  ΔL*00 RGB-XYZ: ΔL*00 de valores medidos respecto al equivalente sRGB de los números RGB.
  ΔC*00 RGB-XYZ: ΔC*00 de valores medidos respecto al equivalente sRGB de los números RGB.
  ΔH*00 RGB-XYZ: ΔH*00 de valores medidos respecto al equivalente sRGB de los números RGB.
