"guide.s4.reminder": |-
  Durante la medición no muevas el instrumento ni cambies los ajustes del monitor, salvo cuando la aplicación te pida ajustarlos. No dejes que la pantalla se suspenda o se bloquee.
"guide.s4.interrupt_title": |-
  Si la ejecución se detiene o falla
"guide.s4.interrupt": |-
  Las mediciones ya hechas se conservan en la carpeta de la sesión. Al empezar de nuevo, la aplicación puede ofrecer continuar una medición interrumpida: acepta solo si nada se movió ni cambió; si no, repite ese paso. No se instala nada hasta que aceptes el diálogo final, y tu perfil anterior sigue activo hasta entonces. El mensaje de error dice qué falló; el registro de la aplicación tiene los detalles.
"guide.s4.blocked_prep": |-
  Confirma primero los elementos de preparación obligatorios.
