"info.mr_settings": |-
  Puede <font weight='bold'>verificar la precisión</font> de un perfil ICC o LUT 3D mediante un informe de medición que contiene estadísticas detalladas sobre los errores de color de los parches medidos.

  Al verificar un LUT 3D, asegúrese de usar la misma configuración con la que se creó el LUT 3D.

  <font weight='bold'>Consejo:</font> Para crear un informe de autocomprobación en lugar de un informe de medición, mantenga pulsada la tecla ALT en su teclado.
"info.profile_settings": |-
  El <font weight='bold'>perfilado</font> es el proceso de <font weight='bold'>caracterizar</font> la pantalla y registrar su respuesta en un <font weight='bold'>perfil de dispositivo ICC</font>. El perfil de dispositivo ICC puede ser usado por aplicaciones que admiten gestión de color ICC para una <font weight='bold'>corrección de color completa de la pantalla</font>, y/o puede utilizarse para crear un <font weight='bold'>LUT 3D</font> (LUT = Look Up Table), que cumple el mismo propósito en aplicaciones que admiten LUT 3D.

  La cantidad de parches medidos influye en la precisión alcanzable del perfil resultante. Para una calidad razonable en un perfil basado en matriz 3x3 y curvas, unas pocas decenas de parches pueden ser suficientes si la pantalla tiene buenas propiedades de mezcla aditiva del color y linealidad. Algunas pantallas profesionales entran en esa categoría. Si se desea la máxima precisión posible, se recomienda un perfil basado en LUT con varios cientos hasta varios miles de parches. El ajuste de carta de prueba <font weight='bold'>“Auto-optimized”</font> tiene en cuenta automáticamente las no linealidades y la respuesta real de la pantalla, y debe usarse para obtener la mejor calidad. Con ello, puede ajustar un control deslizante para elegir un compromiso entre precisión del perfil resultante y tiempo de medición y cálculo.
