"argyll.instrument.driver.missing": |-
  El controlador ArgyllCMS para su instrumento de medición parece no estar instalado o está instalado incorrectamente. Por favor compruebe que su instruemento de medición se muestra en Windows' gestor de perifericos debajo de „Argyll LibUSB-1.0A devices“ y (re-)instalar el controlador si es necesario. Por favor lea la documentacion para instrucciones de instalación.
"argyll.instrument.drivers.install": |-
  Instalar controladores de instrumentos de ArgyllCMS...
"argyll.instrument.drivers.install.confirm": |-
  Solo necesita instalar los controladores específicos de ArgyllCMS si tiene un instrumento de medición que no sea ColorMunki Display, i1 Display Pro, Huey, ColorHug, specbos, spectraval o K-10.

  ¿Desea continuar?
"argyll.instrument.drivers.install.failure": |-
  Falló la instalación de los controladores de instrumentos de ArgyllCMS.
"argyll.instrument.drivers.install.restart": |-
  Debe desactivar la aplicación de firma de controladores para instalar los controladores de instrumentos de ArgyllCMS. Para ello, es necesario reiniciar el sistema. Seleccione “Solucionar problemas” en la página que aparecerá, luego “Opciones avanzadas”, “Configuración de inicio” y finalmente “Reiniciar”. Al iniciar, seleccione “Deshabilitar el uso obligatorio de controladores firmados”. Tras el reinicio, elija de nuevo “Instalar controladores de instrumentos de ArgyllCMS...” en el menú para instalar los controladores. Si no ve la opción “Solucionar problemas”, consulte la sección de la documentación de DisplayCAL “Instalación de controladores de instrumentos en Windows” para un método alternativo para desactivar la aplicación de firma de controladores.
"argyll.instrument.drivers.uninstall": |-
  Desinstalar controladores de instrumentos de ArgyllCMS...
"argyll.instrument.drivers.uninstall.confirm": |-
  Nota: La desinstalación no afecta a los controladores de instrumentos que están actualmente en uso, solo elimina el controlador del almacén de controladores de Windows. Si desea volver a un controlador del fabricante ya instalado para su instrumento, tendrá que usar el Administrador de dispositivos de Windows para cambiar manualmente al controlador del fabricante. Para ello, haga clic derecho sobre el instrumento y seleccione “Actualizar software de controlador...”, luego “Buscar software de controlador en el equipo”, “Elegir en una lista de controladores de dispositivo en el equipo” y finalmente seleccione de la lista el controlador del fabricante para su instrumento.

  ¿Desea continuar?
"argyll.instrument.drivers.uninstall.failure": |-
  Falló la desinstalación de los controladores de instrumentos de ArgyllCMS.
"argyll.instrument.drivers.uninstall.success": |-
  Desinstalación de los controladores de instrumentos de ArgyllCMS completada.
