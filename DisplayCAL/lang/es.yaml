"plan.title": |-
  Plan de medición
"plan.cal.title": |-
  1. Calibración: las curvas del monitor
"plan.cal.text": |-
  Lleva el monitor al objetivo (punto blanco, brillo, curva de tonos) mediante sus controles y las curvas de la tarjeta gráfica. Produce curvas de calibración, no un perfil.
"plan.prof.title": |-
  2. Perfilado: medir cómo muestra el color el monitor
"plan.prof.text": |-
  Muestra una carta de parches de color y mide cada uno. Cuantos más parches, más tarda; el resultado es un archivo de datos del que se calcula el perfil.
"plan.icc.title": |-
  3. Tipo de perfil ICC
"plan.chart.title": |-
  4. Carta de prueba y verificación
"plan.chart.text": |-
  Más parches pueden aumentar la precisión potencial del perfil, pero no la garantizan: una ejecución más larga también deriva más, y el resultado solo se sabe bueno tras verificarlo (pestaña Verificación).
"plan.chart.value": |-
  Carta: %s parches · tiempo estimado: %s
"plan.chart.unknown_time": |-
  sin estimar para este instrumento
"plan.type.value": |-
  Tipo de perfil: %s
"plan.type.change": |-
  Cámbialo en la pestaña Perfilado (opciones avanzadas).
"plan.type.g.use": |-
  Tres primarios y una curva simple por canal. Archivo muy pequeño y la mayor compatibilidad; solo transformaciones colorimétricas.
"plan.type.g.cost": |-
  Basta una carta pequeña: se ajustan pocos valores, así que más parches añaden tiempo sin una mejora proporcional.
"plan.type.G.use": |-
  Como el anterior con una sola gamma para todos los canales: el perfil matricial más simple y robusto, el que menos sigue una respuesta tonal inusual.
"plan.type.G.cost": |-
  Basta una carta pequeña.
"plan.type.s.use": |-
  Matriz con una curva individual por canal, por lo que sigue una respuesta tonal que no es una simple gamma. Archivo pequeño, buena compatibilidad; solo colorimétrico. El preajuste de la aplicación para macOS lo evita por problemas notificados con perfiles matriciales de curvas individuales.
"plan.type.s.cost": |-
  Basta una carta moderada; una muy grande añade sobre todo tiempo.
"plan.type.S.use": |-
  Matriz con una curva compartida: equilibra de hecho los grises y es la opción matricial más predecible. Es el preajuste de la aplicación para macOS (heredado del proyecto original por problemas notificados con perfiles cLUT y matriciales de curvas individuales en macOS); es una elección de preajuste, no un límite de macOS.
"plan.type.S.cost": |-
  Basta una carta pequeña o moderada.
"plan.type.x.use": |-
  Una tabla de consulta (LUT) que puede describir un monitor que no sigue un modelo matricial. Archivo mayor; las aplicaciones sin soporte LUT pueden no usarlo bien.
"plan.type.x.cost": |-
  Se beneficia de una carta mayor, con rendimientos decrecientes; una ejecución larga añade deriva y tiempo.
"plan.type.X.use": |-
  Una LUT más una matriz: la matriz sirve a las aplicaciones que ignoran la LUT. Preajuste de la aplicación fuera de macOS. Archivo mayor que un perfil matricial.
"plan.type.X.cost": |-
  Se beneficia de una carta mayor, con rendimientos decrecientes; las cartas mayores tardan muchas horas.
"plan.type.l.use": |-
  Una LUT en codificación Lab. Rara vez la mejor opción para un monitor; archivo grande.
"plan.type.l.cost": |-
  Requiere una carta grande; ejecuciones largas.
"plan.long.title": |-
  Ejecución larga
"plan.long.warn": |-
  Se estima que esta ejecución dure unos %s. Las ejecuciones largas están expuestas a la deriva y a las interrupciones.
"plan.blocks.title": |-
  Ejecución larga segura (bloques)
"plan.blocks.text": |-
  La carta se mide en bloques consecutivos; cada bloque terminado se guarda en disco. Si algo detiene la ejecución, pierdes como máximo el bloque actual y puedes continuar con el resto. Contrapartidas: un parche blanco extra por bloque, el instrumento arranca de nuevo entre bloques y cada bloque se normaliza a su propio blanco (una pequeña corrección de deriva).
"plan.blocks.size": |-
  Tamaño del bloque
"plan.blocks.off": |-
  Desactivado (una sola ejecución)
"plan.blocks.n": |-
  %s parches
"plan.blocks.recommend": |-
  Recomendado para una ejecución de esta duración.
"plan.blocks.too_small": |-
  La carta es lo bastante pequeña para ejecutarse como un solo bloque.
"blocks.needs_calibration": |-
  Este instrumento debe calibrarse en su referencia (baldosa o tapa) entre ejecuciones, por lo que los bloques no están disponibles; la ejecución queda en una pieza.
"blocks.unknown_instrument": |-
  Los bloques no están disponibles: el instrumento no está en la lista que conoce la aplicación.
"blocks.no_instrument": |-
  Los bloques no están disponibles sin un instrumento seleccionado.
"awake.title": |-
  Mientras dura la ejecución
"awake.on": |-
  La aplicación evita que el ordenador y la pantalla entren en suspensión, solo durante la ejecución, y lo libera al terminar.
"awake.off": |-
  La prevención de la suspensión está desactivada. Mantén tú el ordenador y la pantalla activos.
"awake.cannot": |-
  No puede evitar: cerrar la tapa, elegir Suspender, el botón de encendido, una batería baja, bloquear la pantalla o cambiar de usuario. Si se interrumpe la ruta de visualización, la medición puede no continuar. Mantén el ordenador enchufado y la sesión desbloqueada.
"awake.keep": |-
  Mantener la prevención de suspensión durante las ejecuciones
"awake.not.lid": |-
  cerrar la tapa
"awake.not.manual_sleep": |-
  elegir Suspender
"awake.not.lock": |-
  bloquear la pantalla
"awake.not.battery": |-
  una batería baja
"recover.title": |-
  Una medición anterior no terminó
"recover.intro": |-
  La aplicación encontró %s que nunca registró un final. Esto es lo que se sabe; no es un diagnóstico de la causa.
"recover.sessions": |-
  sesiones sin terminar
"recover.fact.last_seen": |-
  Última señal de actividad: %s
"recover.fact.progress": |-
  Progreso en el último registro: %s de %s
"recover.fact.stage": |-
  Etapa: %s
"recover.fact.child_exit": |-
  El proceso del motor de medición terminó con el código %s
"recover.fact.child_no_exit": |-
  El motor de medición estaba en marcha y no se registró su final.
"recover.fact.slept": |-
  El ordenador estuvo suspendido unos %s durante esta sesión.
"recover.fact.memory": |-
  Memoria de la aplicación: primera %s, última %s, máxima %s
"recover.fact.disk": |-
  Espacio libre en disco en el último registro: %s
"recover.fact.no_clean_exit": |-
  La aplicación no registró un cierre normal.
"recover.fact.unknown": |-
  Casi no se registró nada.
"recover.blocks_done": |-
  Bloques terminados y guardados: %s de %s
"recover.no_blocks": |-
  Esta sesión no se midió en bloques; ArgyllCMS no puede continuar una ejecución desde la mitad, así que hay que repetir la medición. Todo lo que guardó la sesión sigue disponible para exportar.
"recover.conditions_changed": |-
  El monitor, el instrumento, el modo de medición, la corrección o la versión del motor no son los de la sesión, por lo que sus bloques no deben combinarse con mediciones nuevas.
"recover.can_continue": |-
  Continuar: medir los bloques restantes (%s). El bloque interrumpido se mide de nuevo desde el principio.
"recover.conditions_note": |-
  Antes de continuar: mantén el monitor con los mismos ajustes y caliente, y el instrumento en la misma pantalla.
"recover.export": |-
  Exportar datos recuperables…
"recover.open_folder": |-
  Mostrar la carpeta de la sesión
"recover.dismiss": |-
  Ahora no
"recover.discard": |-
  Ya lo he visto; no volver a mostrar
"recover.exported": |-
  Copiado en %s
"notify.done": |-
  Medición terminada
"notify.failed": |-
  La medición se detuvo con un error
"notify.cancelled": |-
  Medición cancelada
"notify.flood": |-
  Se detuvo el motor de medición porque repetía sin fin la misma salida. Tus datos guardados están intactos.
"guide.s4.choices_title": |-
  Qué significa cada elección
"recover.continue_btn": |-
  Continuar con los bloques restantes
"recover.continue_how": |-
  Siguiente: inicia de nuevo el perfilado con los mismos ajustes. Los bloques terminados se reutilizan y solo se miden los restantes.
"diag.menu": |-
  Diagnóstico y soporte…
"diag.title": |-
  Diagnóstico y soporte
"diag.intro": |-
  Si algo sale mal, la aplicación conserva un registro local que ayuda a averiguar por qué. La aplicación no envía nada a ningún sitio: puedes ver el registro, crear un paquete y decidir tú si lo envías.
"diag.versions": |-
  Versiones de la aplicación, del sistema y de los componentes
"diag.copy_versions": |-
  Copiar versiones
"diag.copy_id": |-
  Copiar ID de sesión (%s)
"diag.logs_where": |-
  Carpeta de registros: %s. Los registros antiguos se rotan y el tamaño total está limitado, así que no pueden llenar el disco.
"diag.open_logs": |-
  Abrir la carpeta de registros
"diag.export_btn": |-
  Exportar paquete de diagnóstico…
"diag.debug": |-
  Registro detallado (solo en esta ejecución; se desactiva solo tras %s minutos)
"diag.send_title": |-
  Cómo enviar el paquete al soporte
"diag.send_how": |-
  1) Crea el paquete (botón de arriba) y guárdalo donde quieras. 2) Puedes abrir el ZIP con cualquier programa y leer lo que contiene. 3) Si decides enviarlo: abre la página de soporte, describe el problema y adjunta el ZIP al informe. La aplicación no lo envía por ti y no pide cuenta.
"diag.open_issue": |-
  Abrir la página de soporte
"diag.show_folder": |-
  Mostrar en la carpeta
"diag.export.title": |-
  Exportar paquete de diagnóstico
"diag.export.intro": |-
  Elige qué entra en el paquete. Se guarda como archivo ZIP en el lugar que elijas; no se sube nada.
"diag.export.included": |-
  Incluido
"diag.export.optional": |-
  Solo si tú lo eliges
"diag.export.optional_note": |-
  Pueden contener datos personales o voluminosos. Están desactivadas por defecto y solo se añaden si las marcas.
"diag.export.redact": |-
  Eliminar datos personales del texto (nombre de usuario, carpetas personales, correo, tokens, identificadores de red y hardware) — recomendado
"diag.export.redact_off": |-
  Sin esto, las rutas con tu nombre de usuario y otros identificadores quedan en el paquete. ¿Continuar sin eliminarlos?
"diag.export.never": |-
  Nunca se incluye: volcados de memoria, tus archivos personales, contraseñas, tokens o claves.
"diag.export.save": |-
  Guardar paquete…
"diag.export.done": |-
  Paquete guardado: %s
"diag.export.failed": |-
  No se pudo guardar el paquete: %s
"diag.cat.none": |-
  nada disponible
"diag.cat.versions": |-
  Versiones y sistema
"diag.cat.versions.desc": |-
  Aplicación, sistema operativo, ArgyllCMS y otros componentes, número de pantallas y nombres de instrumentos.
"diag.cat.logs": |-
  Registro de la aplicación
"diag.cat.logs.desc": |-
  Inicio, detección del instrumento, dependencias, comprobaciones de actualización y errores, con las líneas de salida de ArgyllCMS. Cada línea tiene hora, nivel e ID de la ejecución.
"diag.cat.sessions": |-
  Sesiones de medición (últimas 3)
"diag.cat.sessions.desc": |-
  Estado y etapas de las ejecuciones, cuándo empezó cada proceso de ArgyllCMS y cómo terminó, progreso, memoria y espacio libre en disco. Sin lecturas.
"diag.cat.crashes": |-
  Trazas de fallo de la aplicación
"diag.cat.crashes.desc": |-
  Escritas por la propia aplicación cuando se detiene de forma anormal. No son los informes de fallo del sistema.
"diag.cat.measurements": |-
  Archivos de medición de esas sesiones
"diag.cat.measurements.desc": |-
  Las listas de parches y las lecturas (.ti1/.ti3). Describen tu pantalla e instrumento; añádelas solo si el soporte las pide.
"diag.cat.profile": |-
  El perfil ICC actual de la pantalla
"diag.cat.profile.desc": |-
  El archivo del perfil, sin cambios. Añádelo solo si el problema es del perfil.
"diag.cat.system_reports": |-
  Informes de fallo del sistema (macOS)
"diag.cat.system_reports.desc": |-
  Copias de los últimos informes que macOS escribió sobre la aplicación. Los archivos del sistema no se modifican. Pueden contener rutas de archivos.
"diag.package_readme": |-
  Paquete de diagnóstico de DisplayCAL-CG. Se creó en tu ordenador y se guardó donde elegiste; no se subió nada. Ábrelo con cualquier programa ZIP. manifest.json indica qué contiene y qué se dejó fuera; environment.txt tiene las versiones; logs/ el registro de la aplicación; sessions/ los diarios de las sesiones de medición.
"lookup.link": |-
  ¿No conoces la tecnología de tu monitor? Busca el modelo
"lookup.title": |-
  Descubre la tecnología de tu monitor
"lookup.intro": |-
  Para elegir una corrección adecuada ayuda saber qué tipo de monitor es. Busca su modelo en un sitio de especificaciones y vuelve para elegir en la lista de correcciones. No se elige nada por ti.
"lookup.model.title": |-
  Tu monitor
"lookup.model.builtin": |-
  Pantalla integrada de Apple de este Mac. Identificador del modelo de Mac: %s
"lookup.model.builtin_noid": |-
  Pantalla integrada de Apple de este Mac. No se pudo leer el identificador del modelo de Mac.
"lookup.model.external": |-
  Monitor conectado a este ordenador (no una pantalla integrada de Apple).
"lookup.model.unknown": |-
  No se pudo identificar el modelo.
"lookup.model.edit": |-
  Modelo que se buscará (corrígelo si es incorrecto o incompleto):
"lookup.go.title": |-
  Buscar
"lookup.act.everymac_id": |-
  Buscar %s en everymac.com
"lookup.act.everymac_home": |-
  Copiar el modelo y abrir everymac.com
"lookup.act.copy_open_specs": |-
  Copiar el modelo y abrir displayspecifications.com
"lookup.note.several_variants": |-
  El sitio lista todas las configuraciones que comparten este identificador, así que pueden aparecer varias entradas. Se muestran tal cual; no se elige nada por ti.
"lookup.note.no_mac_id": |-
  No se conoce el identificador del modelo de Mac, así que no se ofrece una búsqueda directa. Al abrirse el sitio, pega el modelo en su búsqueda.
"lookup.note.paste_in_search": |-
  La búsqueda de este sitio forma parte de su página y no se puede rellenar desde un enlace. El modelo se copia: pégalo en el cuadro de búsqueda.
"lookup.note.no_model": |-
  No se conoce ningún modelo. El sitio se abre sin búsqueda; escribe el modelo que leas en la etiqueta del monitor o en su menú.
"lookup.offline": |-
  La aplicación no usa internet aquí: tu navegador abre el sitio. Sin conexión, el modelo queda en el portapapeles para buscarlo más tarde.
"lookup.copied": |-
  Copiado al portapapeles: %s
"lookup.open_failed": |-
  No se pudo abrir el navegador. Abre %s tú mismo; el modelo está en el portapapeles.
"lookup.concepts.title": |-
  Cuatro cosas distintas: no las mezcles
"lookup.concept.panel": |-
  <b>Tecnología del panel</b> — cómo funciona la capa de cristal líquido (IPS, VA, TN). Indica ángulos de visión y contraste. Por sí sola no elige la corrección.
"lookup.concept.emissive": |-
  <b>Retroiluminación / tecnología emisiva</b> — qué produce la luz (LED blanco, LED con fósforo, punto cuántico, RGB LED, CCFL, OLED). Su espectro de luz es lo que una corrección de colorímetro debe compensar sobre todo.
"lookup.concept.mode": |-
  <b>Modo de medición</b> — un ajuste del instrumento (por ejemplo, tipo de pantalla con o sin refresco, o un modo integrado en el instrumento). No es una propiedad del monitor.
"lookup.concept.correction": |-
  <b>Corrección</b> — espectral (una muestra espectral de la pantalla, para colorímetros con datos espectrales integrados) o matricial (una matriz para una combinación colorímetro + pantalla, hecha con un instrumento de referencia).
"lookup.src_link": |-
  Fuente: documentación de ArgyllCMS (ccxxmake)
"lookup.upstream.title": |-
  Tecnologías descritas en la guía de DisplayCAL
"lookup.upstream.source": |-
  Fuente: el proyecto DisplayCAL (texto original, sin cambios). Las cifras son datos de los fabricantes tal como se indican allí.
"lookup.caution.title": |-
  Qué te dice y qué no te dice una página de especificaciones
"lookup.caution": |-
  Una página de especificaciones ayuda a reconocer el monitor. No es una corrección validada para la combinación de este monitor con tu sonda. La aplicación no elige una corrección por un nombre comercial, una cifra de gamut o la palabra «LED»: tú confirmas la elección y las herramientas de correcciones existentes (lista, importar, comprobación web, crear) siguen disponibles.
"lookup.goto_correction": |-
  Ir a la elección de la corrección
"lookup.close": |-
  Cerrar
"guide.goal.current": |-
  Mantener mis ajustes actuales
"guide.goal.current.info": |-
  No carga ningún preajuste: el objetivo de calibración, el tipo de perfil, la carta de parches y la corrección del instrumento quedan exactamente como están en los ajustes avanzados.
"guide.s2.kept": |-
  Se mantienen tus ajustes actuales; no se cargó ningún preajuste.
"guide.s2.modified": |-
  Después de elegir «%s», se cambiaron %s ajuste(s) en los ajustes avanzados. El flujo guiado usará los ajustes tal como están ahora, no el preajuste.
"guide.s2.reapply": |-
  Cargar de nuevo el preajuste
"guide.s2.keep_current": |-
