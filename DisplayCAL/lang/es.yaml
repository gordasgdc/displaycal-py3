"support.credits": |-
  Estas acciones apoyan la adaptación %(fork)s. %(original)s fue creado por Florian Höch y lo continúa la comunidad en %(upstream)s; el motor de medición es %(argyll)s, de Graeme Gill. Tienen sus propias páginas y no están afiliados a la adaptación de este fork.
