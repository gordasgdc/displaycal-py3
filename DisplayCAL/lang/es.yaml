"guide.s1.title": |-
  Qué monitor, qué instrumento
"guide.s1.monitor": |-
  Monitor a calibrar
"guide.s1.instrument": |-
  Instrumento
"guide.s1.mode": |-
  Modo de medición
"guide.s1.correction": |-
  Corrección del instrumento
"guide.s1.rescan": |-
  Volver a buscar
"guide.s1.detected_as": |-
  Detectado como: %s
"guide.s1.confirm_model": |-
  Varios productos comparten este identificador, por lo que el modelo exacto no se puede leer del instrumento. Elige el que tienes (solo cambia la ayuda mostrada aquí, no la medición):
"guide.s1.model_unconfirmed": |-
  Modelo sin confirmar
"guide.s1.unknown": |-
  Instrumento fuera del catálogo de la guía. Se usa con el nombre que informa el motor; no se muestra imagen del modelo y no se supone nada sobre él.
"guide.s1.none": |-
  Ningún instrumento seleccionado
"guide.s1.shared_usb": |-
  El identificador USB de este instrumento también lo usan: %s.
"guide.s1.spectro_note": |-
  Los espectrofotómetros miden directamente el espectro de la pantalla y no necesitan corrección de colorímetro.
"guide.s1.correction_none": |-
  Ninguna corrección seleccionada. Un colorímetro es más preciso con una corrección adecuada al tipo de panel (consulta la pestaña Pantalla e instrumento).
"guide.s1.correction_set": |-
  En uso: %s
"guide.s1.mode_current": |-
  Modo: %s
"guide.ready.ok": |-
  Monitor e instrumento detectados por el sistema. Todavía no se ha comprobado nada más.
"guide.ready.busy": |-
  Hay una medición o una búsqueda en curso.
"guide.ready.no_argyll": |-
  No se encontró el motor de medición (ArgyllCMS).
"guide.ready.no_display": |-
  No se detectó ningún monitor.
"guide.ready.no_instrument": |-
  No se detectó ningún instrumento.
"guide.action.install_argyll": |-
  Descargar ArgyllCMS (menú Ayuda → Buscar actualizaciones)
"guide.action.choose_argyll": |-
  O elige una carpeta ArgyllCMS existente en Opciones → Directorio de ejecutables de ArgyllCMS.
"guide.action.rescan": |-
  Pulsa «Volver a buscar».
"guide.action.reconnect": |-
  Desconecta el instrumento, espera unos segundos y vuelve a conectarlo directamente al ordenador (no mediante un hub).
"guide.action.check_permission": |-
  Cierra otro software de color que pueda tener el instrumento ocupado y comprueba que el acceso USB está permitido para esta aplicación.
"guide.place.title": |-
  Coloca el instrumento
"guide.place.calibrate_first": |-
  Cuando se te pida, calibra el instrumento en su baldosa de referencia o base antes de colocarlo en la pantalla.
"guide.place.colorimeter.flat": |-
  Apoya el sensor plano contra la pantalla, mirando hacia ella, con el cable fuera del camino.
"guide.place.colorimeter.counterweight": |-
  Usa el contrapeso (o las ventosas, si tu modelo las tiene) para que el instrumento no se incline.
"guide.place.colorimeter.center": |-
  Céntralo sobre el cuadrado que muestra la ventana de medición; no lo muevas durante la ejecución.
"guide.place.spectro.display_position": |-
  Pon el instrumento en su posición de pantalla (emisión) según las instrucciones en pantalla.
"guide.place.spectro_pen.emission": |-
  Coloca el soporte o adaptador de pantalla (emisión) y apoya el instrumento plano sobre la pantalla.
"guide.place.spectro.center": |-
  Céntralo sobre el cuadrado que muestra la ventana de medición y mantenlo quieto.
"guide.place.generic": |-
  Sigue las instrucciones de colocación del fabricante del instrumento.
"guide.place.screensaver_off": |-
  Asegúrate de que la pantalla no pueda atenuarse, bloquearse ni iniciar un salvapantallas durante la ejecución.
"guide.place.accessories": |-
  Ten a mano: %s
"guide.acc.counterweight": |-
  contrapeso
"guide.acc.ambient_diffuser": |-
  difusor ambiental integrado
"guide.acc.suction_cups": |-
  ventosas
"guide.acc.calibration_cover": |-
  tapa de calibración
"guide.acc.reference_tile": |-
  base de calibración / baldosa de referencia
"guide.acc.ambient_head": |-
  cabezal de luz ambiental
"guide.acc.emission_holder": |-
  soporte o adaptador de pantalla (emisión)
"guide.acc.calibration_cap": |-
  tapa de calibración (referencia oscura)
"guide.illustration_note": |-
  Ilustración, no una fotografía de tu modelo.
"guide.s2.title": |-
  ¿Para qué usarás este monitor?
"guide.s2.hint": |-
  No existe un único objetivo mejor. Elige el uso más cercano; cada valor se puede cambiar después en la pestaña Calibración.
"guide.s2.suggested": |-
  Sugerido para este monitor
"guide.s2.applied": |-
  Preajuste cargado: %s
"guide.s2.not_found": |-
  No se encontró el preajuste de este objetivo; ajusta los valores en la pestaña Calibración.
"guide.s2.builtin_note": |-
  Parece un panel integrado. Las pantallas integradas suelen calibrarse para uso general; los controles de hardware suelen ser limitados.
"guide.goal.photo": |-
  Foto y gráficos
"guide.goal.photo.info": |-
  Punto blanco 5000 K, gamma 2,2, calidad de calibración media. Adecuado para igualar impresiones vistas con luz controlada.
"guide.goal.video": |-
  Vídeo y etalonaje
"guide.goal.video.info": |-
  Punto blanco D65, gamma 2,4, calidad de calibración media. Punto de partida para contenido Rec. 709 en entornos poco iluminados.
"guide.goal.office_web": |-
  Oficina y web
"guide.goal.office_web.info": |-
  Punto blanco 6500 K, gamma 2,2, calibración rápida. Buena opción general para pantallas usadas en la web.
"guide.goal.laptop": |-
  Portátil / pantalla integrada
"guide.goal.laptop.info": |-
  Punto blanco nativo, gamma 2,2, sin paso de ajuste manual de hardware. Para paneles con pocos controles o ninguno.
"guide.goal.srgb": |-
  Contenido sRGB
"guide.goal.srgb.info": |-
  Punto blanco D65 y curva sRGB, calibración rápida. Para trabajo dirigido al estándar sRGB.
"guide.goal.softproof": |-
  Prueba en pantalla
"guide.goal.softproof.info": |-
  Punto blanco 5800 K, 160 cd/m², curva L*, calidad media. Iguala la pantalla con el papel bajo una cabina de visualización.
"guide.s3.title": |-
  Prepara el monitor, la sala y el instrumento
"guide.s3.hint": |-
  Aquí nada se marca por ti: el calentamiento, la luz y la colocación no los puede observar la aplicación. Marca cada elemento cuando sea cierto para ti. Abre «Por qué y fuentes» para ver los motivos y el origen de cada recomendación.
"guide.s3.required": |-
  Obligatorio
"guide.s3.recommended": |-
  Recomendado
"guide.s3.missing": |-
  Marca los elementos obligatorios para continuar.
"guide.prep.warmup": |-
  Deja que el monitor se caliente unos 30 minutos
"guide.prep.warmup.info": |-
  El brillo y el color varían mientras el panel se calienta; medir en frío incorpora esa variación al perfil.
"guide.prep.reset": |-
  Pon el monitor en un modo de imagen neutro
"guide.prep.reset.info": |-
  Usa el modo de fábrica/estándar o «nativo»; desactiva el contraste dinámico, el enfoque y los realces de color.
"guide.prep.auto": |-
  Desactiva el brillo y el desplazamiento de color automáticos
"guide.prep.auto.info": |-
  Los sensores de luz ambiental, Night Shift, True Tone y herramientas tipo f.lux cambian la imagen durante la ejecución.
"guide.prep.ambient": |-
  Reduce la luz parásita y evita reflejos en la pantalla
"guide.prep.ambient.info": |-
  Una luz estable y moderada en la sala da resultados acordes con cómo trabajarás realmente.
"guide.prep.screensaver": |-
  Evita la suspensión, la atenuación y los salvapantallas
"guide.prep.screensaver.info": |-
  Una pantalla que se atenúa o se bloquea durante la ejecución invalida las mediciones.
"guide.prep.probe": |-
  Ten el instrumento listo para colocarlo en la pantalla
"guide.prep.probe.info": |-
  Consulta los pasos de colocación a la derecha. La siguiente ventana muestra el punto exacto.
"guide.s4.title": |-
  Calibra y mide
"guide.s4.intro": |-
  La ejecución tiene estas etapas. Puedes pausar o cancelar; no se instala nada hasta el final.
"guide.s4.stage.adjust": |-
  Ajusta de forma interactiva los controles del monitor (si los tiene)
"guide.s4.stage.calibrate": |-
  Calibración: el motor mide y corrige el equilibrio de grises y la curva de tonos
"guide.s4.stage.profile": |-
  Perfilado: se mide un conjunto de parches de color para describir la pantalla
"guide.s4.stage.build": |-
  El perfil ICC se calcula a partir de las mediciones
"guide.s4.patches": |-
  Mientras se muestran los parches la pantalla permanece neutra: no se aplican efectos, transparencia ni superposiciones.
"guide.s4.start": |-
  Iniciar calibración y perfilado
"guide.s4.blocked": |-
  Todavía no se puede iniciar
"guide.s4.settings_summary": |-
  Objetivo actual: %s
"guide.s4.profile_name": |-
  Nombre del perfil: %s
"guide.s5.title": |-
  Instala y verifica
"guide.s5.intro": |-
  Una ejecución solo es correcta cuando el perfil existe, está instalado para este monitor y supera la verificación. Que termine un proceso no demuestra nada de eso.
"guide.s5.current_profile": |-
  Perfil activo ahora para este monitor: %s
"guide.s5.no_profile": |-
  Todavía no hay ningún perfil instalado para este monitor.
"guide.s5.verify": |-
  Abrir ajustes de verificación
"guide.s5.install": |-
  Abrir instalación del perfil
"guide.s5.what_is": |-
  Qué es cada cosa
"guide.s5.limits": |-
  Límites a tener en cuenta
"guide.concept.calibration": |-
  Calibración
"guide.concept.calibration.info": |-
  Ajusta el comportamiento del propio monitor (brillo, punto blanco, curva de tonos), mediante sus controles y las curvas de la tarjeta gráfica.
"guide.concept.profile": |-
  Perfil ICC
"guide.concept.profile.info": |-
  Describe los colores que muestra el monitor calibrado. Las aplicaciones con gestión de color lo usan; no cambia la pantalla por sí solo.
"guide.concept.curves": |-
  Carga de las curvas
"guide.concept.curves.info": |-
  Las curvas de calibración (vcgt) deben cargarse en la tarjeta gráfica al iniciar sesión para que se apliquen en todo el sistema.
"guide.concept.lut3d": |-
  LUT 3D
"guide.concept.lut3d.info": |-
  Una corrección opcional para reproductores de vídeo y herramientas de etalonaje que no usan perfiles ICC. Se crea aparte, a partir de un perfil terminado.
"guide.limit.color_management": |-
  Las aplicaciones sin gestión de color ignoran el perfil ICC; solo les llegan las curvas de calibración.
"guide.limit.hdr": |-
  HDR y SDR son modos distintos: una calibración hecha en uno no se aplica al otro, y un sistema operativo en modo HDR puede ignorar las curvas.
"guide.limit.multi_display": |-
  Con varios monitores, cada uno necesita su propia ejecución y el perfil queda ligado a ese monitor y a ese instrumento.
"guide.verify.match": |-
  Verificado: el perfil activo para este monitor es el que se acaba de instalar.
"guide.verify.mismatch": |-
  La instalación terminó, pero el sistema informa de otro perfil activo para este monitor. No se confirma que esté aplicado; revisa los ajustes de color del sistema e inténtalo de nuevo.
"guide.verify.none_active": |-
  La instalación terminó, pero el sistema no informa de ningún perfil para este monitor. No se confirma que esté aplicado.
"guide.verify.unreadable": |-
  No se pudo leer el perfil desde el sistema, por lo que no se confirma su uso para este monitor.
"guide.ready.scan_failed": |-
  La detección del monitor y del instrumento falló.
"download.hash.unavailable": |-
  No se pudo establecer la suma de verificación esperada de %s, por lo que no se instaló. Comprueba la conexión e inténtalo de nuevo; el archivo nunca se usa sin verificación.
"download.hash.conflict": |-
  La suma de verificación publicada para %s no coincide con la fijada en esta aplicación. El archivo NO se instaló.
"guide.s1.details": |-
  Detalles y opciones
"guide.s1.action_ready": |-
  El monitor y el instrumento están seleccionados. Continúa con el objetivo y la preparación.
"guide.s1.action_fix": |-
  Resuelve el punto anterior y vuelve a buscar.
"guide.s1.summary": |-
  Medición: %s  ·  Corrección: %s
"guide.s1.model_unconfirmed_hint": |-
  Modelo exacto sin confirmar. Elígelo en los detalles.
"guide.s1.unknown_short": |-
  No está en el catálogo de la guía; no se supone ningún modelo.
"guide.s1.correction_not_needed": |-
  no necesaria (espectrofotómetro)
"guide.s1.correction_none_short": |-
  ninguna seleccionada
"guide.place.kind.colorimeter": |-
  Ilustración genérica: un colorímetro apoyado en la pantalla.
"guide.place.kind.spectro_puck": |-
  Ilustración genérica: un espectrofotómetro tipo disco sobre la pantalla.
"guide.place.kind.spectro_pen": |-
  Ilustración genérica: un espectrofotómetro tipo bolígrafo con soporte de pantalla.
"guide.place.kind.other": |-
  Sin imagen del modelo: el instrumento no está en el catálogo de la guía.
"guide.state.detected": |-
  detectado por el sistema
"guide.state.confirmed": |-
  confirmado por ti
"guide.state.unverified": |-
  sin verificar
"guide.state.blocking": |-
  impide la medición
"guide.mode.guided": |-
  Guiado
"guide.mode.advanced": |-
  Avanzado
"guide.prep.why": |-
  Por qué y fuentes
"guide.prep.sources": |-
  Fuentes
"guide.prep.group.monitor": |-
  El monitor
"guide.prep.group.room": |-
  La sala
"guide.prep.group.instrument": |-
  El instrumento
"guide.prep.group.run": |-
  Durante la medición
"guide.prep.stabilize": |-
  El monitor está encendido y se ha estabilizado
"guide.prep.stabilize.action": |-
  Marca solo si sabes que el monitor lleva encendido el tiempo suficiente. La aplicación no puede saber cuánto lleva encendido.
"guide.prep.stabilize.info": |-
  No existe un tiempo de calentamiento universal. La documentación de ArgyllCMS no da una duración fija: ofrece compensación de la deriva del nivel de blanco para una pantalla que aún se calienta (opciones de la pestaña Pantalla e instrumento), y los espectrómetros también pueden necesitar estabilizarse. Algunos fabricantes dan su propia cifra para su propio producto (ver abajo). Un panel que aún deriva cambia el brillo y el punto blanco durante la ejecución.
"guide.prep.vendor_warmup": |-
  El fabricante de tu modelo recomienda que la pantalla lleve encendida al menos %s minutos antes de calibrar (su propia recomendación, no una regla universal).
"guide.prep.timer.label": |-
  Temporizador opcional de recordatorio
"guide.prep.timer.minutes": |-
  minutos
"guide.prep.timer.start": |-
  Iniciar temporizador
"guide.prep.timer.stop": |-
  Detener temporizador
"guide.prep.timer.running": |-
  Recordatorio en %s
"guide.prep.timer.done": |-
  El temporizador ha terminado. Solo te lo recuerda; marca el elemento anterior solo si consideras estable el monitor.
"guide.prep.timer.note": |-
  El temporizador cuenta desde ahora. No sabe cuánto tiempo llevaba ya encendido el monitor.
"guide.prep.settings": |-
  El monitor está en un modo neutro con las funciones automáticas desactivadas
"guide.prep.settings.action": |-
  Modo de imagen estándar o predeterminado. Desactiva el brillo automático, el contraste dinámico, el desplazamiento de color nocturno/true-tone y el HDR, donde tu monitor o sistema los tengan.
"guide.prep.settings.info": |-
  Las funciones que cambian la imagen por sí solas la cambian durante la ejecución, por lo que las mediciones describirían un estado que ya no existe. Si tu monitor tiene controles, la guía de Datacolor pide ponerlos en sus valores predeterminados antes de calibrar. Qué controles importan depende de tu monitor: si usas el ajuste interactivo, la aplicación te pedirá cambiar el brillo o las ganancias de color en ese momento.
"guide.prep.room": |-
  La luz que llega a la pantalla está controlada
"guide.prep.room.default": |-
  Ninguna lámpara o ventana que ilumine o se refleje en la pantalla; mantén estable la luz de la sala durante la ejecución.
"guide.prep.room.photo": |-
  Calibra con la luz con la que editas normalmente, sin lámparas ni ventanas que iluminen o se reflejen en la pantalla. Igualar impresiones depende también de la luz en que las miras, que es aparte.
"guide.prep.room.video": |-
  Usa el entorno tenue y estable en el que etalonas o ves. Nada debe iluminar ni reflejarse en la pantalla; un entorno luminoso cambia cómo se ve el contraste y aquí no se mide.
"guide.prep.room.office_web": |-
  La luz normal de trabajo está bien si es estable. Evita el sol directo o las lámparas que iluminen o se reflejen en la pantalla.
"guide.prep.room.laptop": |-
  Evita el deslumbramiento en un panel brillante. La luz cambia al mover el portátil; calibra donde más lo uses, sin nada que se refleje en la pantalla.
"guide.prep.room.srgb": |-
  sRGB supone un espacio de trabajo iluminado típico. Mantén la luz estable y evita que lámparas y ventanas iluminen o se reflejen en la pantalla.
"guide.prep.room.softproof": |-
  La pantalla no debe recibir luz directa. Compara con el papel en tu cabina de visualización o bajo la lámpara con la que juzgarás las impresiones; esa luz es aparte de la que cae sobre la pantalla.
"guide.prep.room.info": |-
  Dos cosas distintas. (1) La luz que cae sobre la pantalla: la controlas tú y ninguna fuente debe iluminar ni reflejarse directamente en la pantalla ni en el instrumento (guía de Datacolor). (2) Medición ambiental con el instrumento: opcional, solo para instrumentos con difusor o cabezal ambiental, hecha aparte con el instrumento apuntando hacia arriba sobre el escritorio junto al monitor (documentación de DisplayCAL; guía de Calibrite); ArgyllCMS puede usar ese valor para ajustar a las condiciones de visualización. Esta comprobación NO ha medido tu sala y no puede decir que sea óptima; no existe un valor universal en lux.
"guide.prep.instrument": |-
  El instrumento está conectado y sé cómo colocarlo
"guide.prep.instrument.action": |-
  Conéctalo directamente al ordenador (no a un hub ni al teclado), ten a mano sus accesorios y revisa la secuencia de colocación de la derecha.
"guide.prep.instrument.info": |-
  La guía de Datacolor pide un puerto USB directo, porque hubs, alargadores y puertos de teclado pueden perturbar el flujo de datos. La colocación exacta depende del modelo: la secuencia de la derecha sigue el documento del fabricante cuando se ha comprobado uno y lo dice cuando no.
"guide.prep.run": |-
  No perturbaré la medición
"guide.prep.run.action": |-
  Sin suspensión, salvapantallas, bloqueo ni notificaciones; no moveré el instrumento ni tocaré los ajustes del monitor durante la ejecución, salvo que la aplicación me lo pida.
"guide.prep.run.info": |-
  Una pantalla que se atenúa, se bloquea o muestra una ventana emergente a mitad de la ejecución invalida las mediciones, y cualquier movimiento del instrumento puede estropearlas (guía de Datacolor). El ajuste interactivo es el único momento en que se espera cambiar los controles del monitor.
"guide.pl.title": |-
  Colocación del instrumento
"guide.pl.prev": |-
  Paso anterior
"guide.pl.next": |-
  Paso siguiente
"guide.pl.play": |-
  ▶ Reproducir
"guide.pl.pause": |-
  ❚❚ Pausa
"guide.pl.canvas_desc": |-
  Ilustración del paso de colocación actual. Los mismos pasos están en texto más abajo.
"guide.pl.reduced_note": |-
  Tu sistema pide movimiento reducido: la secuencia no se reproduce sola. Usa las flechas o «Reproducir».
"guide.pl.choose_model": |-
  El modelo exacto decide los pasos físicos. Elige el tuyo en el paso 1 para ver los pasos específicos; hasta entonces se aplican estos pasos generales.
"guide.pl.verified_note": |-
  Estos pasos siguen la guía del fabricante para el modelo elegido (fuentes en la lista de preparación).
"guide.pl.unverified_note": |-
  Pasos generales. No se ha comprobado ningún documento del fabricante para este instrumento; donde sus propias instrucciones difieran, síguelas.
"guide.pl.step.calibrate": |-
  Calibra primero el instrumento
"guide.pl.step.face": |-
  Identifica la cara de medición
"guide.pl.step.diffuser": |-
  Aparta el difusor ambiental
"guide.pl.step.cover": |-
  Quita la tapa del sensor
"guide.pl.step.cable": |-
  Coloca el cable y ajusta el contrapeso
"guide.pl.step.contact": |-
  Apoya el sensor contra la pantalla
"guide.pl.step.tilt": |-
  Inclina ligeramente la pantalla hacia atrás, si lo permite
"guide.pl.step.position": |-
  Céntralo en el área de medición
"guide.pl.generic.calibrate": |-
  Si tu instrumento tiene baldosa de referencia, base o tapa oscura para calibrar el sensor, haz esa calibración cuando la aplicación lo pida, antes de colocarlo en la pantalla. Evita la luz parásita durante una calibración en oscuridad (documentación de ArgyllCMS).
"guide.pl.generic.face": |-
  Localiza la cara de medición: el lado con la lente u óptica. Es el lado que va contra la pantalla. Consulta las instrucciones del instrumento si no estás seguro.
"guide.pl.generic.contact": |-
  Apoya el instrumento plano sobre la pantalla con la cara de medición sobre el cristal. No hace falta presión; no presiones el panel.
"guide.pl.generic.position": |-
  Céntralo en el área de medición que muestra la ventana de medición y mantenlo quieto durante toda la ejecución.
"guide.pl.i1d3.face": |-
  El lado con la almohadilla de espuma es la cara de medición: va contra la pantalla.
"guide.pl.i1d3.diffuser": |-
  Levanta primero el brazo del difusor ambiental y gíralo a la posición trasera hasta que encaje, para dejar la óptica descubierta. Levanta siempre antes de girar.
"guide.pl.i1d3.cable": |-
  Pasa el cable USB por encima de la pantalla y deja el contrapeso colgando detrás. Pulsa el botón del contrapeso y deslízalo según el tamaño de tu pantalla.
"guide.pl.i1d3.contact": |-
  Pon la óptica en contacto con el centro de la pantalla con la almohadilla plana sobre el cristal. No presiones.
"guide.pl.i1d3.position": |-
  Céntralo en el área de medición que muestra la ventana de medición y mantenlo quieto durante toda la ejecución.
"guide.pl.spyder_x.face": |-
  Localiza la cara de medición: el lado con el sensor que va contra la pantalla.
"guide.pl.spyder_x.cover": |-
  Quita la tapa del sensor: se usa como contrapeso, para que la unidad se quede en su sitio y plana contra la pantalla.
"guide.pl.spyder_x.contact": |-
  Coloca la unidad plana contra la pantalla. No hace falta presión.
"guide.pl.spyder_x.tilt": |-
  Si tu soporte lo permite, inclina ligeramente la pantalla hacia atrás para que la unidad se apoye en ella sin sujetarla; cualquier movimiento puede estropear la calibración. Omite este paso si el soporte no lo permite.
"guide.pl.spyder_x.position": |-
  Céntralo en el área de medición que muestra la ventana de medición y mantenlo quieto durante toda la ejecución.
"guide.acc.sensor_cover": |-
  tapa del sensor (se usa como contrapeso)
