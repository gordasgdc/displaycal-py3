  Pentru o utilizare personală ușoară, non-comercială, o contribuție unică poate fi potrivită. Dacă folosești DisplayCAL profesional, o contribuție anuală sau lunară ar face o mare diferență în asigurarea continuității ambelor proiecte.

  Mulțumim tuturor contribuitorilor!
