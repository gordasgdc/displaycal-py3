"support.kind.suggestion": |-
  Sugestie
"support.kind.experience": |-
  Experiență generală
"support.feedback.description": |-
  Descriere
"support.feedback.included": |-
  Inclus în mesajul tău:
"support.feedback.diagnostic": |-
  Include și un diagnostic redactat (nu se include niciodată decât dacă bifezi)
"support.feedback.preview": |-
  Previzualizează diagnosticul
"support.feedback.note": |-
  Aplicația nu trimite nimic singură, iar pentru a trimite acolo ai nevoie de un cont GitHub. Diagnosticul este redactat (folder personal, nume de utilizator, e-mail, adresă IP, numere de serie, tokenuri), dar verifică previzualizarea înainte să-l incluzi.
"support.feedback.open": |-
  Deschide în browser
"support.credits": |-
  Aceste acțiuni susțin adaptarea %(fork)s. %(original)s a fost creat de Florian Höch și este continuat de comunitate la %(upstream)s; motorul de măsurare este %(argyll)s, de Graeme Gill. Ei au propriile pagini și nu sunt afiliați cu adaptarea acestui fork.
"support.invite.close": |-
  Închide
"support.invite.never": |-
  Nu mai afișa
"support.menu.about_section": |-
