"guide.s2.title": |-
  Pentru ce folosești acest monitor?
"guide.s2.hint": |-
  Nu există o țintă unică și cea mai bună. Alege folosința cea mai apropiată; fiecare valoare poate fi schimbată ulterior în fila Calibrare.
"guide.s2.suggested": |-
  Sugerat pentru acest monitor
"guide.s2.applied": |-
  Presetare încărcată: %s
"guide.s2.not_found": |-
  Presetarea pentru acest obiectiv nu a fost găsită; ajustează valorile în fila Calibrare.
"guide.s2.builtin_note": |-
  Pare un panou încorporat. Ecranele încorporate se calibrează de obicei pentru uz general; controalele hardware sunt adesea limitate.
"guide.goal.photo": |-
  Foto și grafică
"guide.goal.photo.info": |-
  Punct alb 5000 K, gamma 2.2, calitate medie de calibrare. Potrivit pentru potrivirea cu printuri privite în lumină controlată.
"guide.goal.video": |-
  Video și corecție de culoare
"guide.goal.video.info": |-
  Punct alb D65, gamma 2.4, calitate medie de calibrare. Punct de plecare pentru conținut Rec. 709 în mediu slab luminat.
"guide.goal.office_web": |-
  Birou și web
"guide.goal.office_web.info": |-
  Punct alb 6500 K, gamma 2.2, calibrare rapidă. Alegere generală bună pentru ecrane folosite pe web.
"guide.goal.laptop": |-
  Laptop / ecran încorporat
"guide.goal.laptop.info": |-
  Punct alb nativ, gamma 2.2, fără pasul de reglare manuală hardware. Pentru panouri cu puține controale sau fără.
"guide.goal.srgb": |-
  Conținut sRGB
"guide.goal.srgb.info": |-
  Punct alb D65 și curba sRGB, calibrare rapidă. Pentru lucru destinat standardului sRGB.
"guide.goal.softproof": |-
  Soft-proofing
"guide.goal.softproof.info": |-
  Punct alb 5800 K, 160 cd/m², curbă L*, calitate medie. Potrivește ecranul cu hârtia sub o cabină de vizualizare.
"guide.s3.title": |-
  Pregătește monitorul, camera și instrumentul
"guide.s3.hint": |-
  Nimic de aici nu este bifat în locul tău: încălzirea, lumina și poziționarea nu pot fi observate de aplicație. Bifează fiecare element când este adevărat pentru tine. Deschide „De ce și surse” pentru motive și pentru originea fiecărei recomandări.
"guide.s3.required": |-
  Obligatoriu
"guide.s3.recommended": |-
  Recomandat
"guide.s3.missing": |-
  Bifează elementele obligatorii ca să continui.
"guide.prep.warmup": |-
  Lasă monitorul să se încălzească aproximativ 30 de minute
"guide.prep.warmup.info": |-
  Luminozitatea și culoarea derivă cât timp panoul se încălzește; o măsurare la rece include această derivă în profil.
"guide.prep.reset": |-
  Pune monitorul într-un mod de imagine neutru
"guide.prep.reset.info": |-
  Folosește modul standard/din fabrică sau „nativ”; dezactivează contrastul dinamic, claritatea și îmbunătățirile de culoare.
"guide.prep.auto": |-
  Oprește luminozitatea și temperatura de culoare automate
"guide.prep.auto.info": |-
  Senzorii de lumină ambientală, Night Shift, True Tone și instrumentele tip f.lux schimbă imaginea în timpul rulării.
"guide.prep.ambient": |-
  Reduce lumina parazită și evită reflexiile pe ecran
"guide.prep.ambient.info": |-
  O lumină stabilă și moderată în cameră dă rezultate care se potrivesc cu felul în care vei lucra de fapt.
"guide.prep.screensaver": |-
  Împiedică repausul, reducerea luminozității și screen saverul
"guide.prep.screensaver.info": |-
  Un ecran care se reduce în luminozitate sau se blochează în mijlocul rulării invalidează măsurătorile.
"guide.prep.probe": |-
  Ține instrumentul pregătit pentru a fi pus pe ecran
"guide.prep.probe.info": |-
  Vezi pașii de poziționare din dreapta. Fereastra următoare arată locul exact.
"guide.s4.title": |-
  Calibrează și măsoară
"guide.s4.intro": |-
  Rularea are aceste etape. Poți opri sau anula; nu se instalează nimic până la final.
"guide.s4.stage.adjust": |-
  Reglează interactiv controalele monitorului (dacă are)
"guide.s4.stage.calibrate": |-
  Calibrare: motorul măsoară și corectează echilibrul de gri și curba de tonuri
"guide.s4.stage.profile": |-
  Profilare: se măsoară un set de patch-uri de culoare pentru a descrie ecranul
"guide.s4.stage.build": |-
  Profilul ICC este calculat din măsurători
"guide.s4.patches": |-
  Cât timp sunt afișate patch-urile, ecranul rămâne neutru: nu se aplică efecte, transparență sau suprapuneri peste ele.
"guide.s4.start": |-
  Pornește calibrarea și profilarea
"guide.s4.blocked": |-
  Nu se poate porni încă
"guide.s4.settings_summary": |-
  Ținta curentă: %s
"guide.s4.profile_name": |-
  Numele profilului: %s
"guide.s5.title": |-
  Instalează și verifică
"guide.s5.intro": |-
  O rulare este reușită doar când profilul există, este instalat pentru acest monitor și trece verificarea. Simpla terminare a unui proces nu dovedește nimic din acestea.
"guide.s5.current_profile": |-
  Profilul activ acum pentru acest monitor: %s
"guide.s5.no_profile": |-
  Niciun profil nu este instalat încă pentru acest monitor.
"guide.s5.verify": |-
  Deschide setările de verificare
"guide.s5.install": |-
  Deschide instalarea profilului
"guide.s5.what_is": |-
  Ce este fiecare
"guide.s5.limits": |-
  Limite de reținut
"guide.concept.calibration": |-
  Calibrare
"guide.concept.calibration.info": |-
  Ajustează comportamentul monitorului în sine (luminozitate, punct alb, curbă de tonuri), prin controalele lui și prin curbele plăcii video.
"guide.concept.profile": |-
  Profil ICC
"guide.concept.profile.info": |-
  Descrie culorile pe care le afișează monitorul calibrat. Aplicațiile cu management de culoare îl folosesc; nu schimbă singur ecranul.
"guide.concept.curves": |-
  Încărcarea curbelor
"guide.concept.curves.info": |-
  Curbele de calibrare (vcgt) trebuie încărcate în placa video la autentificare pentru ca ele să se aplice în tot sistemul.
"guide.concept.lut3d": |-
  LUT 3D
"guide.concept.lut3d.info": |-
  O corecție opțională pentru playere video și instrumente de corecție de culoare care nu folosesc profiluri ICC. Se creează separat, dintr-un profil terminat.
"guide.limit.color_management": |-
  Aplicațiile fără management de culoare ignoră profilul ICC; ajung la ele doar curbele de calibrare.
"guide.limit.hdr": |-
  HDR și SDR sunt moduri diferite: o calibrare făcută într-unul nu se aplică celuilalt, iar un sistem de operare în mod HDR poate ocoli curbele.
"guide.limit.multi_display": |-
  Cu mai multe monitoare, fiecare are nevoie de propria rulare, iar profilul este legat de acel monitor și de acel instrument.
"guide.verify.match": |-
  Verificat: profilul activ pentru acest monitor este cel tocmai instalat.
"guide.verify.mismatch": |-
  Instalarea s-a încheiat, dar sistemul raportează un alt profil activ pentru acest monitor. Aplicarea nu este confirmată; verifică setările de culoare ale sistemului și încearcă din nou instalarea.
"guide.verify.none_active": |-
  Instalarea s-a încheiat, dar sistemul nu raportează niciun profil pentru acest monitor. Aplicarea nu este confirmată.
"guide.verify.unreadable": |-
  Profilul nu a putut fi citit înapoi din sistem, deci folosirea lui pentru acest monitor nu este confirmată.
"guide.ready.scan_failed": |-
  Detectarea monitorului și a instrumentului a eșuat.
"download.hash.unavailable": |-
  Nu s-a putut stabili suma de control așteptată pentru %s, deci nu a fost instalat. Verifică conexiunea și încearcă din nou; fișierul nu este folosit niciodată fără verificare.
"download.hash.conflict": |-
  Suma de control publicată pentru %s nu coincide cu cea fixată în această aplicație. Fișierul NU a fost instalat.
"guide.s1.details": |-
  Detalii și opțiuni
"guide.s1.action_ready": |-
  Monitorul și instrumentul sunt selectate. Continuă cu obiectivul și pregătirea.
"guide.s1.action_fix": |-
  Rezolvă punctul de mai sus, apoi rescanează.
"guide.s1.summary": |-
  Măsurare: %s  ·  Corecție: %s
"guide.s1.model_unconfirmed_hint": |-
  Modelul exact nu este confirmat. Alege-l în detalii.
"guide.s1.unknown_short": |-
  Absent din catalogul ghidului; nu se presupune niciun model.
"guide.s1.correction_not_needed": |-
  nu e necesară (spectrofotometru)
"guide.s1.correction_none_short": |-
  nicio corecție selectată
"guide.place.kind.colorimeter": |-
