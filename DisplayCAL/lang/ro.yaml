"info.3dlut_settings": |-
  Un <font weight='bold'>LUT 3D</font> (LUT = tabel de căutare) sau un profil ICC device link poate fi folosit de aplicații compatibile LUT 3D sau device link ICC pentru <font weight='bold'>corecție completă de culoare a monitorului</font>.

  <font weight='bold'>Crearea mai multor LUT-uri 3D (suplimentare) dintr-un profil existent</font>
  Cu profilul dorit selectat sub „Setări”, debifează căsuța „Creează LUT 3D după profilare”.

  <font weight='bold'>Alegerea spațiului de culoare sursă și a curbei de răspuns tonal potrivite</font>
  Pentru LUT-uri 3D și profile device link ICC, spațiul de culoare sursă și curba de răspuns tonal trebuie setate în avans și devin o parte fixă a transformării generale de culoare (spre deosebire de profilele de dispozitiv ICC, care sunt legate dinamic, în timp real). De exemplu, materialul video HD este de obicei masterizat conform standardului Rec. 709 cu fie o curbă de putere pură de aproximativ 2,2-2,4 (relativă, cu offset de ieșire negru de 100%), fie curbă de răspuns tonal Rec. 1886 (absolută, cu offset de ieșire negru 0%). O împărțire între stil Rec. 1886 și putere pură este de asemenea posibilă setând offset-ul de ieșire negru la o valoare între 0% și 100%.

  <font weight='bold'>Gamma „absolută” vs. „relativă”</font>
  Pentru a compensa un nivel de negru diferit de zero al unui monitor real, curba de răspuns tonal trebuie deplasată și scalată corespunzător.
  Gamma „absolută” produce o ieșire reală la 50% intrare care nu se potrivește cu cea a unei curbe de putere idealizate (decât dacă nivelul de negru e zero).
  Gamma „relativă” produce o ieșire reală la 50% intrare care se potrivește cu cea a unei curbe de putere idealizate.

  <font weight='bold'>Intenție de randare</font>
  Dacă ai calibrat la un punct alb diferit de cel impus de spațiul de culoare sursă și vrei să-l folosești pe acela pentru LUT-ul 3D, selectează „Colorimetric relativ”. Altfel, selectează „Colorimetric absolut cu scalarea punctului alb” (scalarea punctului alb va preveni clipping-ul în modul colorimetric absolut, care ar putea apărea dacă punctul alb al spațiului de culoare sursă este în afara gamutului monitorului). Ai și opțiunea de a folosi o intenție de randare non-colorimetrică, care poate comprima sau expanda spațiul de culoare sursă pentru a se încadra în gamutul monitorului (nerecomandat când e necesară acuratețea colorimetrică).
"info.calibration_settings": |-
  <font weight='bold'>Calibrarea</font> se face prin <font weight='bold'>ajustarea interactivă a monitorului</font> pentru a atinge punctul alb și/sau luminanța aleasă, plus, opțional, crearea de <font weight='bold'>curbe de calibrare 1D LUT</font> (LUT = tabel de căutare) pentru a atinge curba de răspuns tonal aleasă și a asigura balansul de gri. Reține că dacă în timpul calibrării vrei doar să ajustezi monitorul și să omiți generarea curbelor 1D LUT, trebuie să setezi curba de răspuns tonal pe „Ca măsurat”. Calibrarea 1D LUT <font weight='bold'>nu</font> poate fi folosită pentru corecție completă de culoare a monitorului — trebuie să creezi un <font weight='bold'>profil de dispozitiv ICC</font> sau un <font weight='bold'>LUT 3D</font> și să le folosești cu aplicații care le suportă pentru acest scop. Totuși, calibrarea 1D LUT completează profilarea și calibrarea LUT 3D.
"info.display_instrument": |-
  <font weight='bold'>Dezactivează toate setările dinamice de imagine ale monitorului</font>, dacă e cazul. Asta poate include funcții precum contrast dinamic, dimming, luminozitate automată și caracteristici similare.

  Asigură-te că lumina nu cade direct pe ecranul monitorului.

  Dacă monitorul tău e un televizor <font weight='bold'>OLED</font> sau <font weight='bold'>Plasmă</font>, sau alt tip cu ieșire de lumină variabilă în funcție de conținutul imaginii, activează <font weight='bold'>compensarea drift-ului de nivel alb</font>.

  Dacă instrumentul tău e un <font weight='bold'>spectrometru</font> și îl folosești în mod de contact pe un monitor cu nivel de negru stabil, ai putea vrea să activezi <font weight='bold'>compensarea drift-ului de nivel negru al instrumentului</font>.

  Dacă instrumentul tău e un <font weight='bold'>colorimetru</font>, ar trebui să folosești un <font weight='bold'>mod de măsurare</font> sau o <font weight='bold'>corecție</font> potrivite pentru monitorul sau tipul de tehnologie al monitorului tău. Reține că unele instrumente (de ex. K-10, Spyder4/5/X) pot oferi o selecție de moduri de măsurare deja calibrate pentru tipuri specifice de monitoare.
"info.display_instrument.warmup": |-
  Ar trebui să lași monitorul să se <font weight='bold'>încălzească</font> cel puțin <font weight='bold'>30 de minute</font> înainte de a începe măsurătorile. Dacă folosești instrumentul în mod de contact, e bine să-l lași pe monitor și în această perioadă.
"info.display_tech": |-
  <font weight='bold'>LCD White LED</font> (WLED cu gamut de culoare normal și acoperire sRGB de până la 100%) este cea mai comună tehnologie de retroiluminare LCD. Monitoarele din această categorie includ majoritatea laptopurilor, notebook-urilor, monitoarelor allround/office și non-HDR pentru gaming din 2010 și mai noi, precum și Apple iMac/MacBook din 2009 până la mijlocul lui 2015.

  <font weight='bold'>LCD PFS Phosphor WLED</font> are un gamut de culoare larg, în două variante comune, cu acoperire P3 sau Adobe RGB de aproximativ 90-99% (conform datelor producătorului). Monitoare comune din categoria gamutului P3 includ Apple iMac 4K/5K Retina (sfârșit de 2015 și mai noi), MacBook Pro Retina (sfârșit de 2016 și mai noi), precum și unele monitoare desktop compatibile HDR. Categoria gamutului Adobe RGB include monitoare profesionale precum EIZO CG2730, HP DreamColor Z24x G2 sau NEC PA271Q.

  <font weight='bold'>LCD Quantum Dot LED</font> are un gamut de culoare larg cu acoperire P3 aproape completă, folosit de obicei în televizoarele Samsung QLED.

  <font weight='bold'>WOLED</font> are un gamut de culoare larg cu acoperire P3 ridicată, folosit de obicei în televizoarele LG OLED.

  <font weight='bold'>RGB OLED/AMOLED</font> are un gamut de culoare larg cu acoperire Adobe RGB și/sau P3 aproape completă, folosit în unele monitoare și laptopuri profesionale, precum și în smartphone-uri de calitate ridicată.

  <font weight='bold'>LCD GB-r-LED</font> (cunoscut și ca GB-LED) are un gamut de culoare larg cu acoperire Adobe RGB de aproximativ 99% (conform datelor producătorului). Monitoare comune din această categorie includ Dell U2413, EIZO CG247/CG277 și NEC PA242W/PA272W.

  <font weight='bold'>LCD RGB LED</font> are un gamut de culoare larg cu acoperire Adobe RGB aproape completă. Monitoare comune din această categorie includ Samsung XL20/XL24/XL30 și HP DreamColor LP2480zx.

  <font weight='bold'>LCD CCFL</font> și <font weight='bold'>LCD CCFL Wide Gamut</font> sunt tehnologii de retroiluminare mai vechi, folosite de obicei în monitoare din 2009 și mai vechi.
"info.display_tech.linklabel.displayspecifications.com": |-
