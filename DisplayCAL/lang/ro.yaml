"profile_loader.fix_profile_associations_warning": |-
  Cât timp încărcătorul de profil rulează, poate gestiona asocierile de profil când schimbi configurația monitorului.

  Înainte de a continua, asigură-te că asocierile de profil arătate mai sus sunt corecte. Dacă nu sunt, urmează acești pași:

  1. Deschide setările de afișare Windows.
  2. Activează toate monitoarele conectate (desktop extins).
  3. Deschide asocierile de profil.
  4. Asigură-te că fiecare monitor are profilul corect alocat. Apoi închide asocierile de profil.
  5. În setările de afișare Windows, revino la configurația anterioară de monitoare și închide setările de afișare.
  6. Acum poți activa „Repară automat asocierile de profil”.
