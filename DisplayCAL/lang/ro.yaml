"guide.place.calibrate_first": |-
  Când ți se cere, calibrează instrumentul pe placa de referință sau pe suportul lui, înainte să-l pui pe ecran.
"guide.place.colorimeter.flat": |-
  Pune senzorul plat pe ecran, cu fața spre ecran, cu cablul scos din calea lui.
"guide.place.colorimeter.counterweight": |-
  Folosește contragreutatea (sau ventuzele, dacă modelul le are) ca instrumentul să nu se încline.
"guide.place.colorimeter.center": |-
  Centrează-l pe pătratul arătat de fereastra de măsurare; nu-l muta pe durata rulării.
"guide.place.spectro.display_position": |-
  Pune instrumentul în poziția de display (emisie), conform instrucțiunilor de pe ecran.
"guide.place.spectro_pen.emission": |-
  Montează suportul sau adaptorul de display (emisie) și sprijină instrumentul plat pe ecran.
"guide.place.spectro.center": |-
  Centrează-l pe pătratul arătat de fereastra de măsurare și ține-l nemișcat.
"guide.place.generic": |-
  Urmează instrucțiunile de poziționare ale producătorului instrumentului.
"guide.place.screensaver_off": |-
  Asigură-te că ecranul nu se poate reduce în luminozitate, bloca sau porni un screen saver în timpul rulării.
