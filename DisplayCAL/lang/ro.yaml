"display.levels_issue_detected": |-
  Diferența de luminanță măsurată între nivelul RGB 0 și 16 este sub 0,02 cd/m², ceea ce indică clipping. Probabil setarea de nivel de intrare și/sau nivel de negru a monitorului este incorectă, și/sau configurația nivelurilor de ieșire a driverului grafic este greșită.

  Dacă monitorul tău are o setare pentru nivelurile de intrare, setează-o pe RGB interval complet (0-255). Dacă monitorul nu are o astfel de setare, setează driverul grafic să producă interval limitat (16-235). Selectează „Reîncearcă” după fiecare schimbare.

  Dacă nici monitorul, nici driverul grafic nu au o setare de interval, poți repara nivelurile de ieșire folosind tabelul gamma al plăcii video apăsând „Continuă”, dar reține că aceasta e cea mai puțin recomandată soluție.
