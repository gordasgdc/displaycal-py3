"drift_compensation.blacklevel": |-
  Compensare drift nivel negru
"drift_compensation.blacklevel.info": |-
  Compensarea drift-ului de nivel negru încearcă să contracareze devierile de măsurare cauzate de drift-ul de calibrare a negrului unui instrument de măsurare aflat în încălzire. Pentru asta, un patch de test negru este măsurat periodic, ceea ce crește timpul total necesar măsurătorilor. Multe colorimetre au compensare de temperatură încorporată, caz în care compensarea drift-ului de nivel negru nu ar trebui să fie necesară, dar majoritatea spectrometrelor nu sunt compensate termic.
"drift_compensation.whitelevel": |-
  Compensare drift nivel alb
"drift_compensation.whitelevel.info": |-
  Compensarea drift-ului de nivel alb încearcă să contracareze devierile de măsurare cauzate de schimbările de luminanță ale unui monitor aflat în încălzire. Pentru asta, un patch de test alb este măsurat periodic, ceea ce crește timpul total necesar măsurătorilor.
