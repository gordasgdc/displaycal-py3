  Exemplu: Pentru majoritatea monitoarelor, acestea sunt numele presetării alese, luminozitatea, contrastul, temperatura de culoare și/sau câștigurile RGB ale punctului alb, precum și gamma. Pe laptopuri și notebook-uri, de obicei doar luminozitatea. Dacă ai schimbat setări suplimentare în timp ce calibrai monitorul, introdu-le și pe acelea, dacă e posibil.
