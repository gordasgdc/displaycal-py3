"warning.suspicious_delta_e": |-
  Avertisment: Au fost găsite măsurători suspecte. Reține că această verificare presupune un monitor de tip sRGB. Dacă monitorul tău diferă de această presupunere (de ex. are un gamut foarte larg sau o curbă de răspuns tonal prea diferită de sRGB), atunci erorile găsite probabil nu sunt relevante.

  A fost întrunit unul sau toate criteriile următoare:

  • Petice consecutive cu numere RGB diferite, dar cu un ΔE*00 suspect de mic al măsurătorilor între ele.
  • Gri RGB cu numere RGB crescătoare față de peticul anterior, dar luminozitate (L*) în scădere.
  • Gri RGB cu numere RGB descrescătoare față de peticul anterior, dar luminozitate (L*) în creștere.
  • ΔE*00 și ΔL*00 sau ΔH*00 sau ΔC*00 neobișnuit de mari ale măsurătorilor față de echivalentul sRGB al numerelor RGB.

  Asta ar putea sugera erori de măsurare. Valorile considerate problematice (ceea ce nu trebuie să fie neapărat adevărat!) sunt evidențiate cu roșu. Verifică măsurătorile cu atenție și marchează-le pe cele pe care vrei să le accepți. Poți edita și valorile RGB și XYZ.
"warning.suspicious_delta_e.info": |-
  Explicația coloanelor Δ:

  ΔE*00 XYZ A/B: ΔE*00 al valorilor măsurate față de valorile măsurate ale peticului anterior. Dacă această valoare lipsește, nu a fost un factor în verificare. Dacă e prezentă, e considerată prea mică.

  0,5 ΔE*00 RGB A/B: ΔE*00 al echivalentului sRGB al numerelor RGB față de echivalentul sRGB al numerelor RGB ale peticului anterior (cu un factor de 0,5). Dacă această valoare e prezentă, reprezintă valoarea de comparație (minimă) în timpul verificării pentru un ΔE*00 XYZ A/B presupus prea mic. Servește ca orientare foarte aproximativă.

  ΔE*00 RGB-XYZ: ΔE*00 al valorilor măsurate față de echivalentul sRGB al numerelor RGB.
  ΔL*00 RGB-XYZ: ΔL*00 al valorilor măsurate față de echivalentul sRGB al numerelor RGB.
  ΔC*00 RGB-XYZ: ΔC*00 al valorilor măsurate față de echivalentul sRGB al numerelor RGB.
  ΔH*00 RGB-XYZ: ΔH*00 al valorilor măsurate față de echivalentul sRGB al numerelor RGB.
