"guide.s4.reminder": |-
  Pe durata măsurării nu muta instrumentul și nu schimba setările monitorului, decât când aplicația îți cere să le reglezi. Nu lăsa ecranul să intre în repaus sau să se blocheze.
"guide.s4.interrupt_title": |-
  Dacă rularea se oprește sau eșuează
"guide.s4.interrupt": |-
  Măsurătorile deja făcute sunt păstrate în folderul sesiunii. Când pornești din nou, aplicația poate oferi continuarea unei măsurători întrerupte: acceptă doar dacă nimic nu a fost mutat sau schimbat; altfel repornește acel pas. Nu se instalează nimic până nu accepți dialogul final, iar profilul tău anterior rămâne activ până atunci. Mesajul de eroare spune ce a eșuat; jurnalul aplicației are detaliile.
"guide.s4.blocked_prep": |-
  Confirmă întâi elementele obligatorii de pregătire.
