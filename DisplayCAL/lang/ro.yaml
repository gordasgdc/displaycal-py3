"argyll.instrument.driver.missing": |-
  Driverul ArgyllCMS pentru dispozitivul tău de măsurare pare să nu fie instalat sau e instalat greșit. Verifică dacă dispozitivul de măsurare apare în Device Manager Windows sub „Argyll LibUSB-1.0A devices” și (re)instalează driverul dacă e necesar. Consultă documentația pentru instrucțiuni de instalare.
"argyll.instrument.drivers.install": |-
  Instalează driverele de instrumente ArgyllCMS...
"argyll.instrument.drivers.install.confirm": |-
  Trebuie să instalezi driverele specifice ArgyllCMS doar dacă ai un instrument de măsurare care nu e ColorMunki Display, i1 Display Pro, Huey, ColorHug, specbos, spectraval sau K-10.

  Vrei să continui?
"argyll.instrument.drivers.install.failure": |-
  Instalarea driverelor de instrumente ArgyllCMS a eșuat.
"argyll.instrument.drivers.install.restart": |-
  Trebuie să dezactivezi Driver Signature Enforcement pentru a instala driverele de instrumente ArgyllCMS. Pentru asta, sistemul trebuie repornit. Selectează „Depanare” pe pagina care va apărea, apoi „Opțiuni avansate”, „Setări pornire” și în final „Repornește”. La pornire, selectează „Dezactivează Driver Signature Enforcement”. După repornire, alege din nou „Instalează driverele de instrumente ArgyllCMS...” din meniu pentru a instala driverele. Dacă nu vezi opțiunea „Depanare”, consultă secțiunea „Instalarea driverului de instrument pe Windows” din documentația DisplayCAL pentru o metodă alternativă de dezactivare a Driver Signature Enforcement.
"argyll.instrument.drivers.uninstall": |-
  Dezinstalează driverele de instrumente ArgyllCMS...
"argyll.instrument.drivers.uninstall.confirm": |-
  Notă: Dezinstalarea nu afectează driverele de instrumente aflate în uz, doar elimină driverul din Driver Store-ul Windows. Dacă vrei să revii la un driver oficial al producătorului pentru instrumentul tău, va trebui să folosești Device Manager Windows pentru a comuta manual la driverul producătorului. Pentru asta, click-dreapta pe instrument și selectează „Actualizează driverul...”, apoi alege „Caut pe computerul meu software pentru driver”, „Aleg dintr-o listă de drivere de pe computerul meu” și în final selectează driverul producătorului pentru instrumentul tău din listă.

  Vrei să continui?
"argyll.instrument.drivers.uninstall.failure": |-
  Dezinstalarea driverelor de instrumente ArgyllCMS a eșuat.
"argyll.instrument.drivers.uninstall.success": |-
  Dezinstalarea driverelor de instrumente ArgyllCMS s-a finalizat.
"argyll.malformed_ccxx": |-
