"info.mr_settings": |-
  Poți <font weight='bold'>verifica acuratețea</font> unui profil ICC sau LUT 3D printr-un raport de măsurare care conține statistici detaliate despre erorile de culoare ale peticilor măsurate.

  Când verifici un LUT 3D, asigură-te că folosești aceleași setări cu care a fost creat LUT-ul 3D.

  <font weight='bold'>Sfat:</font> Pentru a crea un raport de auto-verificare în loc de un raport de măsurare, ține apăsată tasta ALT de pe tastatură.
"info.profile_settings": |-
  <font weight='bold'>Profilarea</font> este procesul de <font weight='bold'>caracterizare</font> a monitorului și înregistrarea răspunsului lui într-un <font weight='bold'>profil de dispozitiv ICC</font>. Profilul de dispozitiv ICC poate fi folosit de aplicații care suportă managementul de culoare ICC pentru <font weight='bold'>corecție completă de culoare a monitorului</font>, și/sau poate fi folosit pentru a crea un <font weight='bold'>LUT 3D</font> (LUT = tabel de căutare), care servește același scop pentru aplicații care suportă LUT-uri 3D.

  Numărul de petice măsurate influențează acuratețea atinsă de profilul rezultat. Pentru un profil de calitate rezonabilă bazat pe matrice 3x3 și curbe, câteva zeci de petice pot fi suficiente dacă monitorul are proprietăți bune de amestecare aditivă a culorilor și liniaritate. Unele monitoare profesionale se încadrează în această categorie. Dacă se dorește cea mai bună acuratețe posibilă, se recomandă un profil bazat pe LUT cu de la câteva sute până la câteva mii de petice. Setarea de testchart <font weight='bold'>„Auto-optimizat”</font> ține cont automat de neliniaritățile și răspunsul real al monitorului și ar trebui folosită pentru cele mai bune rezultate de calitate. Cu asta, poți ajusta un cursor pentru a alege un compromis între acuratețea profilului rezultat și timpul de măsurare și calcul.
