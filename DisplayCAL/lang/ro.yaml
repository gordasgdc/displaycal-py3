"plan.title": |-
  Planul de măsurare
"plan.cal.title": |-
  1. Calibrarea: curbele monitorului
"plan.cal.text": |-
  Aduce monitorul la țintă (punct alb, luminozitate, curbă de tonuri) prin controalele lui și prin curbele plăcii video. Produce curbe de calibrare, nu un profil.
"plan.prof.title": |-
  2. Profilarea: măsurarea felului în care monitorul arată culorile
"plan.prof.text": |-
  Afișează o diagramă de patch-uri de culoare și măsoară fiecare patch. Cu cât sunt mai multe, cu atât durează mai mult; rezultatul este un fișier de date din care se calculează profilul.
"plan.icc.title": |-
  3. Tipul profilului ICC
"plan.chart.title": |-
  4. Diagrama de test și verificarea
"plan.chart.text": |-
  Mai multe patch-uri pot crește acuratețea potențială a profilului, dar nu sunt o garanție: o rulare mai lungă derivă mai mult, iar rezultatul se știe bun abia după verificare (fila Verificare).
"plan.chart.value": |-
  Diagramă: %s patch-uri · timp estimat: %s
"plan.chart.unknown_time": |-
  neestimat pentru acest instrument
"plan.type.value": |-
  Tip de profil: %s
"plan.type.change": |-
  Schimbă în fila Profilare (opțiuni avansate).
"plan.type.g.use": |-
  Trei culori primare și o curbă simplă pe canal. Fișier foarte mic și cea mai largă compatibilitate; doar transformări colorimetrice.
"plan.type.g.cost": |-
  Ajunge o diagramă mică: se potrivesc puține valori, deci patch-urile în plus adaugă timp fără un câștig pe măsură.
"plan.type.G.use": |-
  Ca mai sus, cu o singură gamma pentru toate canalele: cel mai simplu și mai robust profil matricial, cel mai puțin capabil să urmeze un răspuns neobișnuit.
"plan.type.G.cost": |-
  Ajunge o diagramă mică.
"plan.type.s.use": |-
  Matrice cu o curbă individuală pe canal, deci urmează un răspuns de tonuri care nu e o simplă gamma. Fișier mic, compatibilitate bună; doar colorimetric. Presetarea aplicației pentru macOS îl evită din cauza unor probleme raportate acolo cu profilurile matriciale cu curbe individuale.
"plan.type.s.cost": |-
  Ajunge o diagramă moderată; una foarte mare adaugă mai ales timp.
"plan.type.S.use": |-
  Matrice cu o singură curbă comună: echilibrează practic griul și este alegerea matricială cea mai previzibilă. Este presetarea aplicației pentru macOS (moștenită de la proiectul original din cauza unor probleme raportate cu profilurile cLUT și cu cele matriciale cu curbe individuale pe macOS); este o alegere de presetare, nu o limită a macOS.
"plan.type.S.cost": |-
  Ajunge o diagramă mică sau moderată.
"plan.type.x.use": |-
  Un tabel de căutare (LUT) care poate descrie un monitor ce nu urmează un model matricial. Fișier mai mare; aplicațiile fără suport LUT pot să nu-l folosească corect.
"plan.type.x.cost": |-
  Beneficiază de o diagramă mai mare, cu câștiguri tot mai mici; o rulare lungă adaugă derivă și timp.
"plan.type.X.use": |-
  Un LUT plus o matrice: matricea servește aplicațiile care ignoră LUT-ul. Presetarea aplicației în afara macOS. Fișier mai mare decât un profil matricial.
"plan.type.X.cost": |-
  Beneficiază de o diagramă mai mare, cu câștiguri tot mai mici; cele mai mari diagrame durează multe ore.
"plan.type.l.use": |-
  Un LUT în codificare Lab. Rareori alegerea mai bună pentru un monitor; fișier mare.
"plan.type.l.cost": |-
  Cere o diagramă mare; rulări lungi.
"plan.long.title": |-
  Rulare lungă
"plan.long.warn": |-
  Această rulare este estimată la aproximativ %s. Rulările lungi sunt expuse la derivă și la întreruperi.
"plan.blocks.title": |-
  Rulare lungă sigură (blocuri)
"plan.blocks.text": |-
  Diagrama se măsoară în blocuri consecutive; fiecare bloc terminat este salvat pe disc. Dacă ceva oprește rularea, pierzi cel mult blocul curent și poți continua cu restul. Compromisuri: un patch alb în plus pe bloc, instrumentul pornește din nou între blocuri, iar fiecare bloc este normalizat la propriul alb (o mică corecție de derivă).
"plan.blocks.size": |-
  Mărimea blocului
"plan.blocks.off": |-
  Oprit (o singură rulare)
"plan.blocks.n": |-
  %s patch-uri
"plan.blocks.recommend": |-
  Recomandat pentru o rulare de această lungime.
"plan.blocks.too_small": |-
  Diagrama este suficient de mică pentru a rula ca un singur bloc.
"blocks.needs_calibration": |-
  Acest instrument trebuie calibrat pe referința lui (placă sau capac) între rulări, deci blocurile nu sunt disponibile pentru el; rularea rămâne întreagă.
"blocks.unknown_instrument": |-
  Blocurile nu sunt disponibile: instrumentul nu este în lista cunoscută de aplicație.
"blocks.no_instrument": |-
  Blocurile nu sunt disponibile fără un instrument selectat.
"awake.title": |-
  Cât timp durează rularea
"awake.on": |-
  Aplicația împiedică intrarea în repaus a computerului și a ecranului, doar pe durata rulării, și eliberează acest lucru la final.
"awake.off": |-
  Prevenirea repausului este oprită. Menține tu computerul și ecranul active.
"awake.cannot": |-
  Nu poate împiedica: închiderea capacului, alegerea Repaus, butonul de pornire, o baterie descărcată, blocarea ecranului sau schimbarea utilizatorului. Dacă traseul de afișare este întrerupt, măsurarea poate să nu continue. Ține computerul la alimentare și sesiunea deblocată.
"awake.keep": |-
  Menține prevenirea repausului pe durata rulărilor
"awake.not.lid": |-
  închiderea capacului
"awake.not.manual_sleep": |-
  alegerea Repaus
"awake.not.lock": |-
  blocarea ecranului
"awake.not.battery": |-
  o baterie descărcată
"recover.title": |-
  O măsurare anterioară nu s-a încheiat
"recover.intro": |-
  Aplicația a găsit %s care nu a înregistrat niciodată un final. Acestea sunt faptele cunoscute; nu este un diagnostic al cauzei.
"recover.sessions": |-
  sesiuni neterminate
"recover.fact.last_seen": |-
  Ultimul semn de activitate: %s
"recover.fact.progress": |-
  Progres la ultima înregistrare: %s din %s
"recover.fact.stage": |-
  Etapă: %s
"recover.fact.child_exit": |-
  Procesul motorului de măsurare s-a încheiat cu codul %s
"recover.fact.child_no_exit": |-
  Motorul de măsurare rula și nu s-a înregistrat încheierea lui.
"recover.fact.slept": |-
  Computerul a fost în repaus aproximativ %s în această sesiune.
"recover.fact.memory": |-
  Memoria aplicației: prima %s, ultima %s, maxima %s
"recover.fact.disk": |-
  Spațiu liber pe disc la ultima înregistrare: %s
"recover.fact.no_clean_exit": |-
  Aplicația nu a înregistrat o închidere normală.
"recover.fact.unknown": |-
  Aproape nimic nu a fost înregistrat.
"recover.blocks_done": |-
  Blocuri terminate și salvate: %s din %s
"recover.no_blocks": |-
  Această sesiune nu a fost măsurată în blocuri; ArgyllCMS nu poate continua o rulare din mijloc, deci măsurarea trebuie repetată. Tot ce a salvat sesiunea rămâne disponibil pentru export.
"recover.conditions_changed": |-
  Monitorul, instrumentul, modul de măsurare, corecția sau versiunea motorului nu sunt aceleași ca în sesiune, deci blocurile ei nu trebuie combinate cu măsurători noi.
"recover.can_continue": |-
  Continuă: măsoară blocurile rămase (%s). Blocul întrerupt se măsoară din nou de la început.
"recover.conditions_note": |-
  Înainte de a continua: ține monitorul în aceleași setări și încălzit, iar instrumentul pe același ecran.
"recover.export": |-
  Exportă datele recuperabile…
"recover.open_folder": |-
  Arată folderul sesiunii
"recover.dismiss": |-
  Nu acum
"recover.discard": |-
  Am văzut; nu mai afișa
"recover.exported": |-
  Copiat în %s
"notify.done": |-
  Măsurare încheiată
"notify.failed": |-
  Măsurarea s-a oprit cu o eroare
"notify.cancelled": |-
  Măsurare anulată
"notify.flood": |-
  Motorul de măsurare a fost oprit pentru că repeta la nesfârșit aceeași ieșire. Datele salvate sunt intacte.
"guide.s4.choices_title": |-
  Ce înseamnă fiecare alegere
"recover.continue_btn": |-
  Continuă cu blocurile rămase
"recover.continue_how": |-
  Următorul pas: pornește din nou profilarea cu aceleași setări. Blocurile terminate sunt refolosite și se măsoară doar cele rămase.
"diag.menu": |-
  Diagnostic și suport…
"diag.title": |-
  Diagnostic și suport
"diag.intro": |-
  Dacă ceva nu merge, aplicația păstrează local o evidență care ajută să afli de ce. Aplicația nu trimite nimic nicăieri: poți privi evidența, poți crea un pachet și decizi tu dacă îl trimiți.
"diag.versions": |-
  Versiunile aplicației, ale sistemului și ale componentelor
"diag.copy_versions": |-
  Copiază versiunile
"diag.copy_id": |-
  Copiază ID-ul sesiunii (%s)
"diag.logs_where": |-
  Folderul de loguri: %s. Logurile vechi sunt rotite, iar dimensiunea totală este limitată, deci nu pot umple discul.
"diag.open_logs": |-
  Deschide folderul de loguri
"diag.export_btn": |-
  Exportă pachet de diagnostic…
"diag.debug": |-
  Jurnal detaliat (doar pentru această rulare; se oprește singur după %s de minute)
"diag.send_title": |-
  Cum trimiți pachetul către suport
"diag.send_how": |-
  1) Creează pachetul (butonul de mai sus) și salvează-l unde vrei. 2) Poți deschide ZIP-ul cu orice program și citi ce conține. 3) Dacă hotărăști să îl trimiți: deschide pagina de suport, descrie problema și atașează ZIP-ul la raport. Aplicația nu îl trimite în locul tău și nu cere cont.
"diag.open_issue": |-
  Deschide pagina de suport
"diag.show_folder": |-
  Arată în folder
"diag.export.title": |-
  Exportă pachetul de diagnostic
"diag.export.intro": |-
  Alege ce intră în pachet. Se salvează ca fișier ZIP în locul ales de tine; nu se încarcă nimic.
"diag.export.included": |-
  Inclus
"diag.export.optional": |-
  Numai dacă alegi tu
"diag.export.optional_note": |-
  Acestea pot conține date personale sau voluminoase. Sunt oprite implicit și se adaugă numai dacă le bifezi.
"diag.export.redact": |-
  Elimină datele personale din text (nume de utilizator, foldere personale, e-mail, tokenuri, identificatori de rețea și hardware) — recomandat
"diag.export.redact_off": |-
  Fără aceasta, căile cu numele tău de utilizator și alți identificatori rămân în pachet. Continui fără să le elimini?
"diag.export.never": |-
  Nu se include niciodată: dump-uri de memorie, fișierele tale personale, parole, tokenuri sau chei.
"diag.export.save": |-
  Salvează pachetul…
"diag.export.done": |-
  Pachet salvat: %s
"diag.export.failed": |-
  Pachetul nu a putut fi salvat: %s
"diag.cat.none": |-
  nimic disponibil
"diag.cat.versions": |-
  Versiuni și sistem
"diag.cat.versions.desc": |-
  Aplicația, sistemul de operare, ArgyllCMS și alte componente, numărul de monitoare și numele instrumentelor.
"diag.cat.logs": |-
  Jurnalul aplicației
"diag.cat.logs.desc": |-
  Pornire, detectarea instrumentului, dependențe, verificări de actualizare și erori, cu liniile de ieșire ArgyllCMS. Fiecare linie are ora, nivelul și ID-ul rulării.
"diag.cat.sessions": |-
  Sesiuni de măsurare (ultimele 3)
"diag.cat.sessions.desc": |-
  Starea și etapele rulărilor, când a pornit fiecare proces ArgyllCMS și cum s-a încheiat, progresul, memoria și spațiul liber pe disc. Fără citiri.
"diag.cat.crashes": |-
  Urme de blocare ale aplicației
"diag.cat.crashes.desc": |-
  Scrise de aplicație când se oprește anormal. Nu sunt rapoartele de blocare ale sistemului.
"diag.cat.measurements": |-
  Fișierele de măsurare ale acelor sesiuni
"diag.cat.measurements.desc": |-
  Listele de patch-uri și citirile (.ti1/.ti3). Descriu monitorul și instrumentul tău; adaugă-le doar dacă suportul le cere.
"diag.cat.profile": |-
  Profilul ICC curent al monitorului
"diag.cat.profile.desc": |-
  Fișierul profilului, nemodificat. Adaugă-l doar dacă problema ține de profil.
"diag.cat.system_reports": |-
  Rapoarte de blocare ale sistemului (macOS)
"diag.cat.system_reports.desc": |-
  Copii ale ultimelor rapoarte scrise de macOS despre aplicație. Fișierele sistemului nu sunt modificate. Pot conține căi de fișiere.
"diag.package_readme": |-
  Pachet de diagnostic DisplayCAL-CG. A fost creat pe computerul tău și salvat unde ai ales; nu s-a încărcat nimic. Deschide-l cu orice program ZIP. manifest.json arată ce conține și ce a fost lăsat deoparte; environment.txt are versiunile; logs/ jurnalul aplicației; sessions/ jurnalele sesiunilor de măsurare.
"lookup.link": |-
  Nu știi tehnologia monitorului? Caută modelul
"lookup.title": |-
  Află tehnologia monitorului
"lookup.intro": |-
  Ca să alegi o corecție potrivită, ajută să știi ce fel de monitor este. Caută modelul pe un site de specificații, apoi revino și alege din lista de corecții. Nimic nu se alege în locul tău.
"lookup.model.title": |-
  Monitorul tău
"lookup.model.builtin": |-
  Ecranul integrat Apple al acestui Mac. Identificatorul modelului de Mac: %s
"lookup.model.builtin_noid": |-
  Ecranul integrat Apple al acestui Mac. Identificatorul modelului de Mac nu a putut fi citit.
"lookup.model.external": |-
  Monitor conectat la acest calculator (nu un ecran integrat Apple).
"lookup.model.unknown": |-
  Modelul nu a putut fi identificat.
"lookup.model.edit": |-
  Modelul care va fi căutat (corectează-l dacă e greșit sau incomplet):
"lookup.go.title": |-
  Caută
"lookup.act.everymac_id": |-
  Caută %s pe everymac.com
"lookup.act.everymac_home": |-
  Copiază modelul și deschide everymac.com
"lookup.act.copy_open_specs": |-
  Copiază modelul și deschide displayspecifications.com
"lookup.note.several_variants": |-
  Site-ul listează toate configurațiile care au acest identificator, deci pot apărea mai multe intrări. Sunt arătate ca atare; nimic nu se alege în locul tău.
"lookup.note.no_mac_id": |-
  Identificatorul modelului de Mac nu este cunoscut, deci nu se oferă o căutare directă. Când se deschide site-ul, lipește modelul în căutarea lui.
"lookup.note.paste_in_search": |-
  Căutarea acestui site face parte din pagina lui și nu poate fi completată dintr-un link. Modelul este copiat: lipește-l în caseta de căutare.
"lookup.note.no_model": |-
  Nu se cunoaște niciun model. Site-ul se deschide fără căutare; scrie modelul citit pe eticheta monitorului sau în meniul lui.
"lookup.offline": |-
  Aplicația nu folosește internetul aici: browserul tău deschide site-ul. Fără conexiune, modelul rămâne în clipboard ca să îl cauți mai târziu.
"lookup.copied": |-
  Copiat în clipboard: %s
"lookup.open_failed": |-
  Browserul nu a putut fi deschis. Deschide tu %s; modelul este în clipboard.
"lookup.concepts.title": |-
  Patru lucruri diferite — nu le amesteca
"lookup.concept.panel": |-
  <b>Tehnologia panoului</b> — cum funcționează stratul de cristale lichide (IPS, VA, TN). Spune despre unghiuri de vizualizare și contrast. Nu alege singură corecția.
"lookup.concept.emissive": |-
  <b>Iluminarea / tehnologia emisivă</b> — ce produce lumina (LED alb, LED cu fosfor, quantum dot, RGB LED, CCFL, OLED). Spectrul luminii ei este ce trebuie să compenseze în principal o corecție de colorimetru.
"lookup.concept.mode": |-
  <b>Modul de măsurare</b> — o setare a instrumentului (de exemplu tipul de ecran cu sau fără reîmprospătare, sau un mod încorporat în instrument). Nu este o proprietate a monitorului.
"lookup.concept.correction": |-
  <b>Corecția</b> — spectrală (un eșantion spectral al ecranului, pentru colorimetre cu date spectrale încorporate) sau matriceală (o matrice pentru o combinație colorimetru + ecran, făcută cu un instrument de referință).
"lookup.src_link": |-
  Sursă: documentația ArgyllCMS (ccxxmake)
"lookup.upstream.title": |-
  Tehnologii descrise în ghidul DisplayCAL
"lookup.upstream.source": |-
  Sursă: proiectul DisplayCAL (text upstream, neschimbat). Cifrele sunt din datele producătorilor, așa cum sunt date acolo.
"lookup.caution.title": |-
  Ce îți spune și ce nu îți spune o pagină de specificații
"lookup.caution": |-
  O pagină de specificații ajută la recunoașterea monitorului. Nu este o corecție validată pentru combinația acestui monitor cu sonda ta. Aplicația nu alege o corecție după un nume comercial, o cifră de gamut sau cuvântul „LED”: tu confirmi alegerea, iar uneltele existente de corecții (listă, import, verificare pe web, creare) rămân disponibile.
"lookup.goto_correction": |-
  Mergi la alegerea corecției
"lookup.close": |-
  Închide
"guide.goal.current": |-
  Păstrează setările mele actuale
"guide.goal.current.info": |-
  Nu încarcă nicio presetare: ținta calibrării, tipul de profil, diagrama de patch-uri și corecția instrumentului rămân exact cum sunt în setările avansate.
"guide.s2.kept": |-
  Setările tale actuale sunt păstrate; nu s-a încărcat nicio presetare.
"guide.s2.modified": |-
  După ce ai ales „%s”, %s setare/setări au fost schimbate în setările avansate. Fluxul ghidat va folosi setările așa cum sunt acum, nu presetarea.
"guide.s2.reapply": |-
  Încarcă din nou presetarea
"guide.s2.keep_current": |-
  Tratează-le drept setările mele actuale
"guide.goal.modified_suffix": |-
  schimbat în setările avansate
"help.sections.expand": |-
  Ce schimbă fiecare setare de aici
"help.label.when": |-
  Se potrivește când:
"help.label.needs": |-
  Dependențe și atenționări:
"help.label.unit": |-
  Unitate:
"help.label.default": |-
  Valoarea implicită a aplicației:
"help.label.unavailable": |-
  Indisponibil acum:
"help.kind.required": |-
  Necesar pentru rulare
"help.kind.context": |-
  Depinde de situația ta
"help.kind.optional": |-
  Opțional
"help.val.on": |-
  activat
"help.val.off": |-
  dezactivat
"help.val.quality.v": |-
  foarte scăzută
"help.val.quality.l": |-
  scăzută
"help.val.quality.m": |-
  medie
"help.val.quality.h": |-
  ridicată
"help.val.quality.u": |-
  ultra
"help.val.testchart.auto": |-
  auto-optimizat
"help.val.range.full": |-
  interval complet 0–255
"help.val.range.video": |-
  interval video 16–235
"help.reason.generic": |-
  Setările actuale nu o permit; vezi „Depinde de” mai sus.
"help.reason.hidden": |-
  Apare doar când sunt folosite setările de care ține (unele rânduri apar doar cu „Arată opțiunile avansate”).
"help.reason.correction_instrument": |-
  Instrumentul selectat nu poate folosi o corecție: spectrometrele măsoară direct lumina, iar unele instrumente au propriile moduri.
"help.reason.correction_mode": |-
  Ascuns cât timp modul de măsurare este „automat” sau diagrama este una folosită pentru crearea corecțiilor.
"help.reason.observer": |-
  Un fișier de corecție fixează observatorul, deci alegerea e blocată cât timp acesta este folosit.
"help.reason.lut3d_apply_cal": |-
  Disponibilă când se creează acum un LUT 3D sau când profilul curent conține curbe de calibrare (vcgt).
"help.reason.lut3d_gamut_mapping": |-
  Modul „PCS-către-dispozitiv” cere un profil de tip LUT cu tabel B2A de rezoluție mare: setează tipul de profil la unul LUT și activează opțiunea de rezoluție mare, sau folosește un profil care îl are deja.
"help.reason.verify_simulate_white": |-
  Disponibilă când e selectat un profil de simulare sau când diagrama conține valori XYZ/Lab cu un patch alb.
"help.reason.verify_simulation_profile": |-
  Cere un profil de simulare al cărui spațiu de culoare corespunde diagramei.
"help.reason.profile_type": |-
  Butonul de mapare a gamutului se aplică doar profilurilor de tip LUT.
"sec.display_instrument.devices": |-
  Ce ecran și cu ce instrument
"sec.display_instrument.devices.purpose": |-
  Ce se măsoară și dispozitivul care măsoară. Ambele sunt necesare înainte de orice măsurare.
"sec.display_instrument.correction": |-
  Corecție pentru colorimetre
"sec.display_instrument.correction.purpose": |-
  Doar pentru colorimetre: ajustează citirile lor la tipul de ecran măsurat. Spectrometrele nu au nevoie de ea. Ce spune un site de specificații despre un monitor nu alege o corecție în locul tău.
"sec.display_instrument.behavior": |-
  Cum se comportă măsurarea
"sec.display_instrument.behavior.purpose": |-
  Setări de timp, derivă și interval de semnal. Valorile implicite se potrivesc multor ecrane; schimbă una când o problemă concretă o indică.
"sec.calibration.process": |-
  Cum se ajustează ecranul
"sec.calibration.process.purpose": |-
  Dacă ajustezi controalele proprii ale monitorului în timpul rulării și dacă o calibrare existentă este doar reîmprospătată.
"sec.calibration.target": |-
  Cum trebuie să arate ecranul (țintă)
"sec.calibration.target.purpose": |-
  Albul, negrul și curba de tonuri spre care țintește calibrarea. „Ca măsurat” lasă o valoare așa cum o are monitorul.
"sec.calibration.room": |-
  Lumina camerei și punctul negru
"sec.calibration.room.purpose": |-
  Corecții pentru mediul de vizualizare și pentru neutralitatea tonurilor închise.
"sec.calibration.precision": |-
  Viteză față de precizie
"sec.calibration.precision.purpose": |-
  O calibrare mai atentă măsoară mai mult și durează mai mult; estimarea arată cât.
"sec.profiling.type": |-
  Tipul de profil
"sec.profiling.type.purpose": |-
  Tipul de profil ICC care se scrie. Decide cât din comportamentul ecranului este descris și câte patch-uri sunt utile.
"sec.profiling.chart": |-
  Diagrama de măsurare (patch-uri)
"sec.profiling.chart.purpose": |-
  Culorile care se măsoară. Mai multe patch-uri costă timp și ajută doar unde tipul de profil le poate folosi.
"sec.profiling.name": |-
  Nume și locație
"sec.profiling.name.purpose": |-
  Cum se numește profilul și unde se salvează. Substituenții completează automat data, monitorul și setările.
"sec.lut3d.create": |-
  Creează un LUT 3D
"sec.lut3d.create.purpose": |-
  Un LUT 3D este un tabel de conversie a culorilor pentru playere video și unelte care nu folosesc profiluri ICC.
"sec.lut3d.source": |-
  Din ce convertește LUT-ul 3D
"sec.lut3d.source.purpose": |-
  Spațiul de culoare sursă și curba de tonuri ale conținutului pe care îl vei afișa.
"sec.lut3d.mapping": |-
  Cum se mapează culorile
"sec.lut3d.mapping.purpose": |-
  Cum sunt tratate culorile din afara a ceea ce poate arăta ecranul și dacă se includ curbele de calibrare.
"sec.lut3d.file": |-
  Format de fișier și precizie
"sec.lut3d.file.purpose": |-
  Fișierul în care se salvează LUT-ul 3D, dimensiunea și codarea lui. Potrivește ce așteaptă playerul sau unealta care îl va încărca.
"sec.verification.what": |-
  Ce se măsoară
"sec.verification.what.purpose": |-
  Diagrama sau referința ale căror culori se măsoară pentru a verifica un profil sau un LUT 3D.
"sec.verification.simulate": |-
  Simulează alt dispozitiv
"sec.verification.simulate.purpose": |-
  Verifică cum ar reproduce acest ecran punctul alb sau profilul altui dispozitiv.
"help.display.name": |-
  Monitor
"help.display.what": |-
  Alege ecranul care va fi măsurat. Lista arată ecranele raportate de sistem, plus ținte virtuale (o pagină web, madVR, Prisma, Resolve) folosite în configurații video.
"help.display.when": |-
  Întotdeauna. Cu mai multe monitoare, alege-l pe cel pe care va sta instrumentul: profilul creat aparține acelui monitor.
"help.display.needs": |-
  Necesar: nicio măsurare nu poate începe fără un ecran. După ce conectezi sau muți un ecran, folosește butonul de reîmprospătare.
"help.lut_access.name": |-
  Acces la tabelul gamma al plăcii video
"help.lut_access.what": |-
  Alege al cui tabel gamma al plăcii video (curbele de calibrare) este încărcat și schimbat în timpul măsurării. De obicei chiar ecranul măsurat; se folosește altă ieșire când dispozitivul măsurat nu poate primi curbe, dar altul poate.
"help.lut_access.when": |-
  Lasă-l pe ecranul măsurat, dacă instalarea ta nu are o ieșire separată pentru curbe (unele lanțuri video).
"help.lut_access.needs": |-
  O alegere separată există doar dacă e activată în Opțiuni → Avansat. Butonul de legare ține ambele alegeri identice.
"help.instrument.name": |-
  Instrument
"help.instrument.what": |-
  Dispozitivul de măsurare. Un spectrometru citește tot spectrul luminii; un colorimetru citește prin filtre de culoare și are nevoie de un mod de măsurare sau de o corecție potrivite ecranului.
"help.instrument.when": |-
  Întotdeauna pentru măsurare. Nu e necesar pentru a edita setări sau a crea un LUT 3D dintr-un profil existent.
"help.instrument.needs": |-
  Necesar pentru măsurare. Instrumentele detectate sunt listate; după conectare, folosește butonul de reîmprospătare. Unele instrumente au aceeași identitate USB: modul ghidat îți cere să confirmi modelul exact.
"help.mode.name": |-
  Mod de măsurare
"help.mode.what": |-
  Cum măsoară instrumentul acest tip de ecran (de exemplu tip cu sau fără reîmprospătare, sau un mod încorporat în instrument). Este o setare a instrumentului, nu o proprietate a monitorului.
"help.mode.when": |-
  Alege cel care se potrivește tipului de ecran. Cu un colorimetru fie alegi un mod, fie folosești o corecție.
"help.mode.needs": |-
  O corecție poate seta singură modul; lista o urmează atunci.
"help.correction.name": |-
  Corecție pentru colorimetre
"help.correction.what": |-
  Ajustează citirile unui colorimetru pentru tipul de ecran. O corecție spectrală descrie spectrul luminii unui fel de ecran; o corecție matriceală se face pentru un colorimetru și un ecran cu un instrument de referință. „Automat” folosește un fișier de corecție al cărui câmp Display corespunde numelui acestui monitor; „Niciuna” nu aplică nimic.
"help.correction.when": |-
  Un colorimetru pe ecrane LED, cu gamut larg sau OLED, unde filtrele lui singure pot citi greșit culorile.
"help.correction.needs": |-
  Doar colorimetre. Un nume comercial, o cifră de gamut sau cuvântul „LED” nu dovedește că o corecție se potrivește: tu o alegi și o confirmi. Uneltele de import, verificare pe web și creare sunt lângă listă; căutarea modelului ajută la recunoașterea monitorului.
"help.whitelevel_drift.name": |-
  Compensarea derivei nivelului alb
"help.whitelevel_drift.what": |-
  Măsoară din când în când un patch alb în timpul rulării și corectează citirile pentru schimbările de luminozitate ale ecranului.
"help.whitelevel_drift.when": |-
  Ecrane a căror luminozitate se schimbă cât se încălzesc sau în funcție de imagine (de exemplu OLED și plasmă).
"help.whitelevel_drift.needs": |-
  Adaugă măsurători, deci rularea durează mai mult.
"help.blacklevel_drift.name": |-
  Compensarea derivei nivelului negru
"help.blacklevel_drift.what": |-
  Măsoară din când în când un patch negru pentru a corecta deriva proprie a negrului instrumentului cât se încălzește.
"help.blacklevel_drift.when": |-
  Spectrometre în mod contact pe ecrane cu nivel de negru stabil. Multe colorimetre corectează singure acest lucru.
"help.blacklevel_drift.needs": |-
  Adaugă măsurători, deci rularea durează mai mult. Oferită doar instrumentelor care o suportă.
"help.update_delay.name": |-
  Întârziere minimă de actualizare a ecranului
"help.update_delay.what": |-
  Timpul minim, în milisecunde, dintre afișarea unui patch și măsurarea lui.
"help.update_delay.when": |-
  Mărește-l când citirile încă arată patch-ul anterior (televizoare lente, ecrane cu procesare grea). Nu poate coborî sub valoarea implicită.
"help.update_delay.needs": |-
  Dezactivată implicit (se folosește valoarea implicită). O valoare mai mare face rularea mai lungă.
"help.settle_mult.name": |-
  Multiplicator pentru timpul de stabilizare al ecranului
"help.settle_mult.what": |-
  Înmulțește timpul acordat ecranului să se stabilizeze după schimbarea unui patch.
"help.settle_mult.when": |-
  Peste 1 pentru ecrane cu răspuns lent. Sub 1 doar pentru a câștiga timp pe ecrane despre care se știe că se stabilizează repede.
"help.settle_mult.needs": |-
  O valoare prea mică lasă patch-ul anterior să se infiltreze în citirea următoare.
"help.ffp.name": |-
  Inserarea unui model pe tot câmpul
"help.ffp.what": |-
  Afișează un model luminos pe tot câmpul un anumit timp, la intervale stabilite în timpul rulării, ca limitarea luminozității ecranului să nu deriveze.
"help.ffp.when": |-
  Ecrane care se întunecă singure la patch-uri închise sau mici și revin la conținut luminos (de exemplu unele OLED și plasmă).
"help.ffp.needs": |-
  Adaugă timp. Intervalul și durata sunt în secunde; nivelul este luminozitatea modelului inserat, în procente.
"help.output_levels.name": |-
  Niveluri de ieșire
"help.output_levels.what": |-
  Spune măsurării ce interval de semnal așteaptă ecranul: automat, interval complet 0–255 sau interval TV (video) 16–235.
"help.output_levels.when": |-
  Interval complet pentru monitoare de calculator; interval video pentru televizoare și lanțuri video care îl așteaptă. Automat lasă alegerea sistemului.
"help.output_levels.needs": |-
  Intervalul video pe un monitor obișnuit ar afișa greșit negrul și albul; un interval greșit le taie în măsurători.
"help.interactive.name": |-
  Ajustare interactivă a monitorului
"help.interactive.what": |-
  Te lasă să schimbi controalele proprii ale monitorului (luminozitate, contrast, câștiguri de culoare) cât timp se arată citiri în direct, până când punctul alb și nivelul alb corespund țintei.
"help.interactive.when": |-
  Monitoare cu controale hardware. Laptopurile și ecranele fără astfel de controale beneficiază doar de curbe.
"help.interactive.needs": |-
  Necesită un instrument. Nu se folosește cât timp „Actualizează calibrarea” este activată.
"help.update_cal.name": |-
  Actualizează calibrarea
"help.update_cal.what": |-
  Rafinează o calibrare existentă ținând cont de derivă, păstrându-i țintele, în loc să înceapă de la zero.
"help.update_cal.when": |-
  O reîmprospătare rapidă a unui monitor deja calibrat cu aceleași setări.
"help.update_cal.needs": |-
  Cere o calibrare anterioară de la care să pornească; țintele provin atunci din ea, iar ajustarea interactivă este omisă.
"help.observer.name": |-
  Observator
"help.observer.what": |-
  Observatorul colorimetric standard folosit pentru a transforma spectrele în culori (de exemplu CIE 1931 2° sau CIE 1964 10°).
"help.observer.when": |-
  Lasă-l pe CIE 1931 2° dacă fluxul tău de lucru sau o corecție nu cere altul.
"help.observer.needs": |-
  Un fișier de corecție poate fixa observatorul; atunci alegerea este blocată.
"help.whitepoint.name": |-
  Punct alb
"help.whitepoint.what": |-
  Culoarea albului spre care țintește calibrarea: albul nativ al monitorului, o temperatură de culoare în kelvin (lumină de zi sau corp negru) sau coordonate x,y. Butonul țintă măsoară lumina de vizualizare; editorul o reglează vizual.
"help.whitepoint.when": |-
  Lucrul comparat cu printuri urmează de obicei lumina de vizualizare (adesea D50, 5000 K); gradarea video își urmează standardul (D65, 6500 K); „nativ” păstrează albul propriu al monitorului și e cel mai rapid.
"help.whitepoint.needs": |-
  Orice țintă diferită de nativ cere controale sau curbe care o pot atinge, în limitele monitorului.
"help.white_level.name": |-
  Nivel alb
"help.white_level.what": |-
  Cât de luminos trebuie să fie albul. „Ca măsurat” păstrează luminozitatea proprie a monitorului.
"help.white_level.when": |-
  Setează-l potrivit luminii camerei și comparației pe care o faci (de exemplu o cabină de vizionare a printurilor față de o cameră de gradare întunecată).
"help.white_level.needs": |-
  Monitorul nu poate depăși luminozitatea maximă; cu ajustarea interactivă îi setezi controlul de luminozitate pentru a atinge valoarea.
"help.black_level.name": |-
  Nivel negru
"help.black_level.what": |-
  Cât de luminos trebuie să fie negrul. „Ca măsurat” păstrează negrul monitorului; o valoare ridică negrul spre ea.
"help.black_level.when": |-
  Rar necesar: pentru a se potrivi cu un dispozitiv cu negru mai ridicat sau pentru a reduce o nepotrivire de contrast.
"help.black_level.needs": |-
  Un ecran nu poate coborî sub negrul lui nativ.
"help.tone_curve.name": |-
  Curbă de tonuri
"help.tone_curve.what": |-
  Cum se mapează semnalul pe luminozitate: o curbă putere (gamma, relativă la negrul măsurat sau absolută de la zero) sau o curbă standard precum sRGB, Rec. 709, Rec. 1886, L* sau SMPTE 240M. „Ca măsurat” nu face nicio calibrare de curbă.
"help.tone_curve.when": |-
  Standardele se potrivesc utilizării lor: sRGB pentru web și birou, Rec. 1886 pentru video în camere întunecate, L* în unele fluxuri de print. „Ca măsurat” e necesar dacă vrei doar corecția profilului, fără curbe 1D.
"help.tone_curve.needs": |-
  Relativă păstrează forma curbei de la negrul real în sus; absolută măsoară față de zero, ceea ce se potrivește curbei ideale doar când negrul este zero.
"help.black_offset.name": |-
  Offset de ieșire pentru negru
"help.black_offset.what": |-
  Cum se amestecă nivelul negru în curba de tonuri: 100 % aplică offsetul la ieșire (ca un ecran real), 0 % la intrare, dând o curbă putere pură de la negru (stilul Rec. 1886).
"help.black_offset.when": |-
  Contează doar când negrul e peste zero; valorile intermediare schimbă forma umbrelor.
"help.black_offset.needs": |-
  Fără efect vizibil pe un ecran cu negru perfect.
"help.ambient.name": |-
  Ajustare după lumina ambientală
"help.ambient.what": |-
  Ajustează curba țintă pentru lumina ambientală a camerei (o ajustare a condițiilor de vizualizare) folosind o valoare în lux pe care o scrii sau o măsori.
"help.ambient.when": |-
  Când lumina camerei face parte din țintă și o cunoști. Omite-o într-o cameră întunecată controlată.
"help.ambient.needs": |-
  Cere o valoare în lux; butonul de măsurare cere un instrument care poate măsura lumina ambientală.
"help.black_point.name": |-
  Corecția punctului negru
"help.black_point.what": |-
  Împinge negrul spre culoarea punctului alb ca tonurile închise să pară neutre. 0 % lasă negrul cum e; 100 % corectează complet; „Auto” lasă programul să aleagă. Rata stabilește cât de repede se estompează corecția odată cu luminozitatea.
"help.black_point.when": |-
  Ecrane al căror negru are dominantă de culoare (frecvent la LCD). Omite-o când vrei negrul nativ al monitorului.
"help.black_point.needs": |-
  Nu poate face negrul unui ecran mai închis. Controlul ratei apare doar cu „Arată opțiunile avansate”.
"help.cal_quality.name": |-
  Calitatea calibrării
"help.cal_quality.what": |-
  Schimbă timp pe precizie: calitățile mai mici măsoară mai puțin și acceptă rezultate mai relaxate; cele mai mari măsoară mai mult.
"help.cal_quality.when": |-
  O calitate mai mică pentru o verificare rapidă; una mai mare pentru calibrarea finală.
"help.cal_quality.needs": |-
  Estimarea de dedesubt arată timpul; „ultra” poate dura mult.
"help.profile_type.name": |-
  Tip de profil
"help.profile_type.what": |-
  Tipul de profil ICC. Tipurile matriciale (o curbă comună sau curbe pe canal, plus o matrice) sunt mici și netede; tipurile LUT (XYZ sau Lab) descriu mai mult din comportamentul ecranului, dar cer mai multe patch-uri. Pe macOS presetarea folosește matricea cu o singură curbă, moștenită de la proiectul original.
"help.profile_type.when": |-
  Profiluri matriciale pentru ecrane cu comportament simplu și compatibilitate largă; profiluri LUT când comportamentul ecranului e complex și accepți timpul.
"help.profile_type.needs": |-
  Butonul de mapare a gamutului se aplică doar tipurilor LUT. Nu orice aplicație tratează orice tip.
"help.bpc.name": |-
  Compensarea punctului negru
"help.bpc.what": |-
  Face ca profilul să trateze negrul monitorului drept cel mai întunecat negru când este aplicat (pentru profiluri matriciale).
"help.bpc.when": |-
  Când vrei umbre păstrate la conversia către alte dispozitive. Aplicațiile pot aplica și propria compensare.
"help.bpc.needs": |-
  Efectul depinde de tipul de profil.
"help.profile_quality.name": |-
  Calitatea profilului
"help.profile_quality.what": |-
  Cât efort pune calculul profilului în netezime și acuratețe (de la scăzută la ultra).
"help.profile_quality.when": |-
  Mai ridicată pentru profilurile finale; mai scăzută pentru teste rapide.
"help.profile_quality.needs": |-
  Calitatea mai ridicată durează mai mult la calcul, nu la măsurare.
"help.testchart.name": |-
  Diagramă de test
"help.testchart.what": |-
  Setul de patch-uri (culori) care se măsoară. „Auto-optimizat” construiește o diagramă din răspunsul real al monitorului; poți și încărca un fișier, crea sau edita o diagramă.
"help.testchart.when": |-
  Auto-optimizat, dacă nu e cerută o diagramă standard sau un set anume de culori.
"help.testchart.needs": |-
  O diagramă fixă înlocuiește cursorul numărului de patch-uri; tipul de profil decide câte patch-uri ajută.
"help.patches.name": |-
  Numărul de patch-uri
"help.patches.what": |-
  Câte patch-uri conține o diagramă auto-optimizată. Mai multe patch-uri înseamnă o măsurare mai lungă.
"help.patches.when": |-
  Profilurile matriciale câștigă puțin din diagrame foarte mari; cele LUT folosesc mai multe.
"help.patches.needs": |-
  Doar pentru diagrama auto-optimizată; estimarea arată timpul.
"help.sequence.name": |-
  Secvența patch-urilor
"help.sequence.what": |-
  Ordinea în care sunt afișate patch-urile. Unele ordini reduc întârzierea de răspuns a ecranului între patch-uri; altele grupează după luminozitate sau culoare.
"help.sequence.when": |-
  Schimb-o doar când răspunsul ecranului sau deriva de temperatură afectează rezultatele.
"help.sequence.needs": |-
  Apare doar cu „Arată opțiunile avansate”.
"help.profile_name.name": |-
  Numele și locația profilului
"help.profile_name.what": |-
  Numele fișierului de profil și descrierea lui. Substituenții (vezi butonul de informații) completează automat data, monitorul, instrumentul și setările; butonul folder stabilește unde se salvează.
"help.profile_name.when": |-
  Păstrează substituenții pentru nume ușor de urmărit sau scrie un nume fix.
"help.lut3d_create.name": |-
  Creează un LUT 3D după profilare
"help.lut3d_create.what": |-
  Creează un LUT 3D după profilare, cu setările de mai jos.
"help.lut3d_create.when": |-
  Când un player video sau o unealtă (madVR, o aplicație de gradare, un televizor) are nevoie de un LUT în loc de un profil ICC.
"help.lut3d_create.needs": |-
  Cere un profil terminat. Formatul și codarea de mai jos trebuie să corespundă cu ce așteaptă playerul.
"help.lut3d_source.name": |-
  Spațiu de culoare sursă
"help.lut3d_source.what": |-
  Spațiul de culoare al conținutului din care convertește LUT-ul (de exemplu Rec. 709, sRGB, DCI-P3, Rec. 2020, ACES) sau spațiul unui profil ales.
"help.lut3d_source.when": |-
  Alege spațiul în care a fost masterizat conținutul tău.
"help.lut3d_source.needs": |-
  Spațiile largi trebuie să încapă în gamutul ecranului sau să fie mapate (vezi „Cum se mapează culorile”).
"help.lut3d_trc.name": |-
  Curba de tonuri sursă
"help.lut3d_trc.what": |-
  Curba de tonuri a conținutului sursă: gamma 2,2, Rec. 1886, curbe HDR (PQ, HLG) sau o curbă personalizată cu gamma ei.
"help.lut3d_trc.when": |-
  Videoul masterizat pentru camere întunecate folosește adesea Rec. 1886; grafica pe calculator de obicei gamma 2,2 sau sRGB.
"help.lut3d_trc.needs": |-
  Curbele HDR aduc controalele de luminanță maximă și de mapare.
"help.lut3d_hdr.name": |-
  Maparea tonurilor și culorilor HDR
"help.lut3d_hdr.what": |-
  Controale pentru conversia conținutului HDR (PQ sau HLG) la ce poate arăta acest ecran: luminanța lui maximă, cum se păstrează luminanța, saturația sau nuanța și limitele de masterizare ale conținutului.
"help.lut3d_hdr.when": |-
  Doar când creezi un LUT 3D pentru conținut HDR.
"help.lut3d_hdr.needs": |-
  Apare doar pentru curbe sursă HDR.
"help.lut3d_black_offset.name": |-
  Offset de ieșire pentru negru (LUT 3D)
"help.lut3d_black_offset.what": |-
  Același offset de ieșire pentru negru ca la calibrare, aplicat curbei sursă a LUT-ului.
"help.lut3d_black_offset.when": |-
  Contează doar când curba sursă este o curbă putere și negrul e peste zero.
"help.lut3d_apply_cal.name": |-
  Aplică calibrarea (curbele plăcii video)
"help.lut3d_apply_cal.what": |-
  Include în LUT-ul 3D curbele de calibrare (vcgt) ale profilului.
"help.lut3d_apply_cal.when": |-
  Când curbele nu vor fi încărcate separat în placa video.
"help.lut3d_apply_cal.needs": |-
  Disponibilă doar când se creează acum un LUT 3D sau când profilul curent conține curbe de calibrare.
"help.lut3d_gamut_mapping.name": |-
  Mod de mapare a gamutului
"help.lut3d_gamut_mapping.what": |-
  Cum sunt tratate culorile sursă din afara gamutului: „dispozitiv-către-PCS invers” inversează răspunsul măsurat al profilului; „PCS-către-dispozitiv” folosește tabelul propriu al profilului.
"help.lut3d_gamut_mapping.when": |-
  Păstrează modul invers dacă profilul nu are un tabel B2A bun, de rezoluție mare, a cărui mapare o vrei.
"help.lut3d_gamut_mapping.needs": |-
  „PCS-către-dispozitiv” cere un profil de tip LUT cu tabel B2A de rezoluție mare.
"help.lut3d_intent.name": |-
  Intenție de randare
"help.lut3d_intent.what": |-
  Cum sunt plasate culorile pe care ecranul nu le poate arăta: colorimetric absolut păstrează culorile exacte și scalează punctul alb; colorimetric relativ păstrează punctul alb și deplasează restul; perceptual și saturație comprimă sau extind spațiul sursă.
"help.lut3d_intent.when": |-
  Relativ când ai calibrat la un punct alb diferit de al spațiului sursă; absolut (cu scalarea punctului alb) când gamutul ecranului depășește sursa.
"help.lut3d_intent.needs": |-
  Intențiile necolorimetrice schimbă culorile; nerecomandate când e nevoie de acuratețe colorimetrică.
"help.lut3d_format.name": |-
  Formatul fișierului LUT 3D
"help.lut3d_format.what": |-
  Formatul de fișier al LUT-ului (de exemplu IRIDAS .cube, madVR .3dlut, DaVinci Resolve .cube și altele oferite de versiunea ta de ArgyllCMS).
"help.lut3d_format.when": |-
  Folosește formatul pe care îl așteaptă playerul sau unealta care îl încarcă.
"help.lut3d_format.needs": |-
  Unele formate limitează dimensiunea, adâncimea de biți sau codarea.
"help.lut3d_encoding.name": |-
  Codarea intrării și ieșirii
"help.lut3d_encoding.what": |-
  Intervalul de semnal al intrării și ieșirii LUT-ului: interval complet 0–255 sau interval video (TV) 16–235 și alte codări video.
"help.lut3d_encoding.when": |-
  Potrivește lanțul: playerele video și televizoarele așteaptă de obicei interval video; ieșirile de calculator, interval complet.
"help.lut3d_encoding.needs": |-
  O nepotrivire strivește sau ridică negrul și albul.
"help.lut3d_size.name": |-
  Dimensiune și adâncime de biți
"help.lut3d_size.what": |-
  Numărul de puncte pe axă (de exemplu 65×65×65) și adâncimea de biți a valorilor de intrare și ieșire.
"help.lut3d_size.when": |-
  Dimensiunile mari dau conversii mai netede și fișiere mai mari; folosește ce suportă ținta.
"help.lut3d_size.needs": |-
  Playerele și dispozitivele limitează dimensiunea și adâncimea de biți.
"help.verify_chart.name": |-
  Diagramă de test sau referință
"help.verify_chart.what": |-
  Diagrama (sau fișierul de referință) ale cărei patch-uri se măsoară și se compară cu ce prezice profilul sau LUT-ul.
"help.verify_chart.when": |-
  O diagramă extinsă mică pentru o verificare rapidă, una mai mare pentru un raport amănunțit.
"help.verify_chart.needs": |-
  Se acceptă diagrame RGB și fișiere de referință XYZ/Lab; lista câmpurilor de culoare arată care se aplică.
"help.verify_simulate_white.name": |-
  Simulează punctul alb
"help.verify_simulate_white.what": |-
  Compară cu un punct alb simulat în loc de cel propriu al ecranului, opțional relativ la punctul alb al profilului.
"help.verify_simulate_white.when": |-
  Verifici cât de bine poate înlocui un ecran albul altui dispozitiv.
"help.verify_simulate_white.needs": |-
  Disponibilă când e selectat un profil de simulare sau când diagrama conține valori XYZ/Lab cu un patch alb.
"help.verify_simulation_profile.name": |-
  Profil de simulare
"help.verify_simulation_profile.what": |-
  Folosește alt profil ca țintă de simulat (de exemplu un standard de print sau video) și verifică cât de bine îl reproduce acest ecran.
"help.verify_simulation_profile.when": |-
  Verificări de soft-proofing sau de standarde.
"help.verify_simulation_profile.needs": |-
  Cere un profil de simulare al cărui spațiu de culoare corespunde diagramei.
"tc.help.intro": |-
  O diagramă este lista de patch-uri (culori) care vor fi măsurate. Majoritatea profilurilor folosesc diagrama automată aleasă în fila Profilare; folosește acest editor când ai nevoie de o diagramă fixă. Câmpurile urmează opțiunile „targen” din ArgyllCMS; trece cu mouse-ul peste un câmp ca să vezi ce schimbă.
"tc.help.source": |-
  Sursă: documentația ArgyllCMS targen
"tc.help.white": |-
  Numărul de patch-uri albe. Albul stabilește punctul alb față de care se face profilul, deci mai multe fac rezultatul mai robust.
"tc.help.black": |-
  Numărul de patch-uri negre.
"tc.help.single": |-
  Pași pe fiecare rampă de o singură culoare (roșu, verde și albastru separat). 0 nu adaugă niciunul.
"tc.help.gray": |-
  Pași pe axa neutră (gri), unde roșu = verde = albastru.
"tc.help.multi": |-
  Pași pe axă ai unei grile regulate prin cubul de culoare. Numărul de patch-uri crește cu cubul pașilor.
"tc.help.bcc": |-
  Folosește o grilă cubică centrată în volum: se adaugă și un punct în mijlocul fiecărei celule.
"tc.help.fullspread": |-
  Numărul de patch-uri suplimentare răspândite pe tot spațiul de culoare de algoritmul ales alături.
"tc.help.algo": |-
  Cum sunt distribuite patch-urile suplimentare: punct cel mai îndepărtat optimizat (implicit), punct îndepărtat incremental, aleator sau cvasi-aleator în spațiul dispozitivului sau perceptual, ori o grilă cubică centrată în volum.
"tc.help.adaption": |-
  Cât de puternic se adaptează distribuția optimizată la dispozitiv (0–100 %). Implicit în ArgyllCMS este 10 %, iar 100 % când se folosește un profil de precondiționare.
"tc.help.angle": |-
  Unghiul grilei simplex pentru grila cubică centrată în volum, între 0,0 și 0,5 (implicit în ArgyllCMS 0,3333).
"tc.help.gamma": |-
  O valoare de tip putere aplicată tuturor valorilor dispozitivului; schimbă locul în care cad patch-urile pe fiecare axă.
"tc.help.neutral": |-
  Concentrează patch-uri în jurul axei neutre, de la 0 la 100 % (implicit în ArgyllCMS 50 %).
"tc.help.dark": |-
  Concentrează mai multe patch-uri în regiunile întunecate. 0 % înseamnă fără accent suplimentar.
"tc.help.precond": |-
  Folosește un profil existent al dispozitivului ca să plaseze patch-urile unde se află cu adevărat culorile lui (precondiționare).
"tc.help.sphere": |-
  Păstrează doar patch-urile din interiorul unei sfere din spațiul de culoare Lab (centru L, a, b și rază), pentru diagrame limitate la o regiune de culoare.
"tc.help.order": |-
  Sortează patch-urile pentru măsurare. Pentru ecrane, unele ordini reduc întârzierea cât ecranul se schimbă între patch-uri.
"tc.help.create": |-
  Construiește diagrama din setările de mai sus.
"profile.patches_note.lut_few": |-
  Această diagramă are %s patch-uri. Documentația ArgyllCMS sugerează între 500 și 3000 de patch-uri pentru dispozitive RGB cu un profil de tip LUT; cu mai puține, profilul este doar aproximativ.
"profile.patches_note.matrix_many": |-
  Această diagramă are %s patch-uri. Conform documentației ArgyllCMS, un profil de tip matrice pentru un dispozitiv RGB cu comportament bun are nevoie doar de câteva sute, deci o diagramă mai mare adaugă mai ales timp de măsurare.
"textsize.title": |-
  Dimensiunea textului
"textsize.normal": |-
  Normal
"textsize.large": |-
  Mare
"textsize.xlarge": |-
  Foarte mare
"textsize.reset": |-
  Revino la dimensiunea implicită
"textsize.tip": |-
  Dimensiunea textului: mărește sau micșorează imediat tot textul aplicației. Nu schimbă fereastra de măsurare și nici măsurătorile.
