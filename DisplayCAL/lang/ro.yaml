"support.star.question": |-
  Îți este utilă aplicația? Poți susține proiectul cu o stea pe GitHub.
"support.star.button": |-
  Oferă o stea pe GitHub
"support.feedback.button": |-
  Trimite feedback
"support.feedback.title": |-
  Trimite feedback
"support.feedback.intro": |-
  Spune-ne ce s-a întâmplat sau ce ar ajuta. Se deschide în browser o pagină precompletată din tracker-ul de probleme GitHub al proiectului; o verifici și o trimiți acolo.
"support.feedback.type": |-
