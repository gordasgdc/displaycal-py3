"profile.share.enter_info": |-
  Poți partaja profilul tău cu alți utilizatori prin serviciul OpenSUSE „ICC Profile Taxi”.

  Te rugăm oferă o descriere semnificativă și introdu mai jos proprietățile monitorului. Citește setările monitorului din meniul OSD al acestuia și introdu doar setările aplicabile monitorului tău care au fost schimbate față de valorile implicite.

  Exemplu: Pentru majoritatea monitoarelor, acestea sunt numele presetării alese, luminozitatea, contrastul, temperatura de culoare și/sau câștigurile RGB ale punctului alb, precum și gamma. Pe laptopuri și notebook-uri, de obicei doar luminozitatea. Dacă ai schimbat setări suplimentare în timp ce calibrai monitorul, introdu-le și pe acelea, dacă e posibil.
