<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 234" width="340" height="234">
<title>Spectrophotometer (puck) on screen</title>
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2d33"/><stop offset="1" stop-color="#15161a"/></linearGradient>
<linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4d55"/><stop offset="1" stop-color="#26282d"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5e66"/><stop offset=".5" stop-color="#2d2f35"/><stop offset="1" stop-color="#121316"/></linearGradient>
<radialGradient id="lens" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#6d7fb8"/><stop offset=".35" stop-color="#1c2236"/><stop offset="1" stop-color="#07080b"/></radialGradient>
<radialGradient id="bloomR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5a4d" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a4d" stop-opacity="0"/></radialGradient>
<radialGradient id="bloomG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#59f07a" stop-opacity=".45"/><stop offset="1" stop-color="#59f07a" stop-opacity="0"/></radialGradient>
<radialGradient id="bloomB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5a7bff" stop-opacity=".5"/><stop offset="1" stop-color="#5a7bff" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a4d"/><stop offset=".25" stop-color="#ffb347"/><stop offset=".5" stop-color="#ffe14d"/><stop offset=".75" stop-color="#59f07a"/><stop offset="1" stop-color="#5a7bff"/></linearGradient>
<linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="beamMask"><rect x="0" y="0" width="340" height="234" fill="url(#fadeR)"/></mask>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse cx="170" cy="212" rx="86" ry="7" fill="#000" opacity=".28" filter="url(#shadow)"/>
<path d="M150 170 L190 170 L198 202 L142 202 Z" fill="url(#bezel)"/>
<rect x="112" y="200" width="116" height="8" rx="4" fill="url(#bezel)"/>
<rect x="38" y="26" width="264" height="150" rx="11" fill="url(#bezel)"/>
<rect x="45" y="33" width="250" height="136" rx="6" fill="url(#glass)"/>
<rect x="140" y="70" width="60" height="60" rx="3" fill="#7d7f85" opacity=".55"/>
<g transform="translate(170,100)">
<circle cx="-14" cy="-6" r="30" fill="url(#bloomR)"/><circle cx="-18" cy="10" r="30" fill="url(#bloomG)"/><circle cx="2" cy="10" r="30" fill="url(#bloomB)"/>
<g mask="url(#beamMask)" transform="translate(-4,0) rotate(-24)" opacity=".7" filter="url(#soft)"><rect x="0" y="-9" width="120" height="18" fill="url(#beam)"/></g>
</g>
<path d="M45 33 H210 L150 169 H45 Z" fill="#fff" opacity=".035"/>
<path d="M170 70 C170 48 170 36 170 20" stroke="#767982" stroke-width="3.2" fill="none"/>
<rect x="140" y="73" width="60" height="60" rx="16" fill="#000" opacity=".35" filter="url(#shadow)"/>
<rect x="140" y="70" width="60" height="60" rx="16" fill="url(#body)" stroke="#8a8d95" stroke-width="1.5"/>
<circle cx="170" cy="100" r="19" fill="#17181c" stroke="#5a5d65" stroke-width="2"/>
<circle cx="170" cy="100" r="11" fill="url(#lens)"/>
<circle cx="166" cy="96" r="2.6" fill="#fff" opacity=".5"/>
<rect x="164" y="121" width="12" height="4" rx="2" fill="#5a5d65"/>
</svg>
