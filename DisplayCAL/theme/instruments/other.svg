<linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4d55"/><stop offset="1" stop-color="#26282d"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5e66"/><stop offset=".5" stop-color="#2d2f35"/><stop offset="1" stop-color="#121316"/></linearGradient>
<radialGradient id="lens" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#6d7fb8"/><stop offset=".35" stop-color="#1c2236"/><stop offset="1" stop-color="#07080b"/></radialGradient>
<radialGradient id="bloomR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5a4d" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a4d" stop-opacity="0"/></radialGradient>
<radialGradient id="bloomG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#59f07a" stop-opacity=".45"/><stop offset="1" stop-color="#59f07a" stop-opacity="0"/></radialGradient>
